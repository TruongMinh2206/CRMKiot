<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM KiotViet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231f6f43'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/static/chart.umd.js"></script>
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f7f7f8;--border:#e9e9ec;--text:#1c1d1f;--text-2:#4b4d52;--muted:#6b6d72;
  --brand:#1f63e0;--brand-2:#eef3fe;--good:#008300;--warn:#c98500;--bad:#d1352b;--bad-2:#fdecea;--good-2:#e8f5e8;--warn-2:#fff4dd;--warn-ink:#8a5a00;--good-ink:#006400;--bad-ink:#b42318;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --radius:10px;--shadow:0 1px 2px rgba(16,17,19,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151617;--surface:#1c1d1f;--surface-2:#222326;--border:#2d2e32;--text:#ececee;--text-2:#b5b7bc;--muted:#94969b;
  --brand:#6c9cfa;--brand-2:#1d2a44;--good:#4cbd4c;--bad:#e66767;--bad-2:#3a2422;--good-2:#1f3320;--warn:#e0a53a;--warn-2:#3a3120;--warn-ink:#e0a53a;--good-ink:#4cbd4c;--bad-ink:#f08a8a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;}}
:root[data-theme="dark"]{
  --bg:#151617;--surface:#1c1d1f;--surface-2:#222326;--border:#2d2e32;--text:#ececee;--text-2:#b5b7bc;--muted:#94969b;
  --brand:#6c9cfa;--brand-2:#1d2a44;--good:#4cbd4c;--bad:#e66767;--bad-2:#3a2422;--good-2:#1f3320;--warn:#e0a53a;--warn-2:#3a3120;--warn-ink:#e0a53a;--good-ink:#4cbd4c;--bad-ink:#f08a8a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}
button,input,select{font:inherit;color:inherit}
.app{min-height:100vh}
/* Máy tính: menu cố định bên trái. Điện thoại (≤760px): menu gọn trong nút hamburger, chỉ hiện khi bấm mở */
.appbar{display:none;position:sticky;top:0;z-index:40;align-items:center;gap:12px;height:52px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.appbar .logo{padding:0;font-size:15px}.appbar .mark{width:26px;height:26px}
.appbar-page{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-weight:600;padding-left:12px;border-left:1px solid var(--border);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{padding:8px;line-height:0;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}.navbtn .ic{width:20px;height:20px}
.navscrim{display:none}
nav{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.navhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.navhead .logo{padding:4px 8px}.navhead .navbtn{display:none}
@media (min-width:761px){.app{display:grid;grid-template-columns:230px 1fr}}
@media (max-width:760px){.appbar{display:flex}.navhead .navbtn{display:inline-flex}
  .navscrim:not([hidden]){display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:65}
  nav{position:fixed;left:0;bottom:0;height:auto;width:min(280px,85vw);padding:14px 14px 18px;z-index:70;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease-in,visibility 0s linear .2s}
  nav.open{transform:none;visibility:visible;box-shadow:var(--shadow);transition:transform .2s ease-out,visibility 0s}}
@media (max-width:520px){.appbar .logo{display:none}.appbar-page{border-left:0;padding-left:0}}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 8px 16px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
nav a.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500}
nav a.item:hover{background:var(--surface-2)}
nav a.item.active{background:var(--brand-2);color:var(--brand);font-weight:600}
nav .spacer{flex:1}
nav .user{font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--border)}
main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.topbar h1{font-size:20px;margin:0;flex:1;min-width:200px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.small{padding:4px 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media (max-width:760px){main{padding:16px}.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.card h3 .x{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.tile .d{font-size:12px;color:var(--muted)}
.delta{font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px}
.delta.up{background:var(--good-2);color:var(--good)} .delta.down{background:var(--bad-2);color:var(--bad)} .delta.flat{background:var(--surface-2);color:var(--muted)}
.chart{position:relative;height:260px} .chart.tall{height:340px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;white-space:nowrap}
th{font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);position:sticky;top:0;cursor:pointer;user-select:none}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--surface-2)}
td.name{white-space:normal;min-width:160px}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--text-2)}
.tag.good{background:var(--good-2);color:var(--good-ink)} .tag.bad{background:var(--bad-2);color:var(--bad-ink)} .tag.warn{background:var(--warn-2);color:var(--warn-ink)} .tag.info{background:var(--brand-2);color:var(--brand)}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center}
.login .card{width:360px}
.login input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);margin:6px 0 12px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal.open{display:flex}
.modal .card{width:min(960px,100%)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px} .kv b{color:var(--text-2);font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.bar i{display:block;height:100%;background:var(--s1);border-radius:4px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.sync{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}.dot.busy{background:var(--warn);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.funnel{display:flex;gap:8px;align-items:stretch}
.funnel div{flex:1;padding:12px;border-radius:10px;background:var(--surface-2);text-align:center}
.funnel b{display:block;font-size:22px}
input.f,select.f,textarea.f{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
@media (max-width:1100px){.kanban{grid-template-columns:1fr 1fr}}
.col{background:var(--surface-2);border-radius:10px;padding:8px;min-height:120px}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:13px}
.lead:hover{box-shadow:var(--shadow)}
.lead b{display:block}.lead .m{display:block;color:var(--muted);font-size:12px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px}
.task .t{flex:1;min-width:0}.task .t b{display:block}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:80px}.prog i{display:block;height:100%;background:var(--s3)}
.prog i.low{background:var(--s8)}.prog i.mid{background:var(--s4)}
textarea{width:100%;min-height:60px;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface-2)}
.evsteps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:900px){.evsteps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.evstep{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.evstep b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evstep.cur{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}.evstep.view{background:var(--brand-2)}.evstep .bar{margin-top:4px;height:5px}
.evboard{display:grid;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.evcol{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;max-height:72vh;min-height:140px}
.evcol.over{border-color:var(--brand);background:var(--brand-2)}
.evcolh{display:flex;align-items:center;gap:6px;padding:9px 10px 6px;font-weight:600;font-size:13px}.evcolh i{width:8px;height:8px;border-radius:50%}.evcolh span{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 8px;font-size:12px}
.evcolb{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.evcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:grab;font-size:13px}
.evcard:hover{border-color:var(--brand)}.evcard.dragging{opacity:.45}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.evgrid{grid-template-columns:1fr}}
label.lb{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2);margin-bottom:10px}label.lb .f{width:100%}
.evtpl{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}.evtpl pre{white-space:pre-wrap;font-family:inherit;background:var(--surface-2);border-radius:8px;padding:10px;margin:6px 0 0;font-size:13px}
.tag.d-BGD{background:#ece4f7;color:#5b3a8c}.tag.d-SALE{background:#fde7ef;color:#b0225a}.tag.d-MKT{background:#e1ecfa;color:#245fa8}.tag.d-KT{background:var(--good-2);color:var(--good)}.tag.d-KHO{background:var(--warn-2);color:var(--warn)}.tag.d-HCNS{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.d-BGD{background:#2c2240;color:#c9b3f0}:root:not([data-theme="light"]) .tag.d-SALE{background:#3d1b29;color:#f0679b}:root:not([data-theme="light"]) .tag.d-MKT{background:#172a42;color:#86b6f3}}
:root[data-theme="dark"] .tag.d-BGD{background:#2c2240;color:#c9b3f0}:root[data-theme="dark"] .tag.d-SALE{background:#3d1b29;color:#f0679b}:root[data-theme="dark"] .tag.d-MKT{background:#172a42;color:#86b6f3}
/* Nền tảng UI/UX (theo ui-ux-pro-max, hồ sơ CRM: phẳng, đổi màu khi hover ~150ms, focus rõ, icon SVG thay emoji) */
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
nav a.item .ic{width:18px;height:18px}
.btn,.chip,nav a.item,.evstep,.evcard,.evcell{transition:background-color .15s ease,border-color .15s ease,color .15s ease}
button{cursor:pointer}.btn:disabled,.btn[aria-busy="true"]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:var(--bad-2)}.btn.icon{padding:4px 6px;line-height:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tile .v{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ferr{color:var(--bad);font-size:12px}.req{color:var(--bad)}
@media (max-width:760px){input,select,textarea{font-size:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* Sự kiện */
.evmeta{gap:6px 18px;margin:-8px 0 12px}.evmeta .ic{color:var(--muted)}
.evgoal{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;margin-bottom:12px;border-left:4px solid var(--brand);box-shadow:none}.evgoal .ic{color:var(--brand);margin-top:3px}
.evnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:var(--warn-2);border-color:var(--warn);box-shadow:none}.evnote .ic{color:var(--warn-ink)}.evnote span{flex:1;min-width:220px}
.evcellw{padding:4px 6px}.evcell{background:none;border:0;padding:3px 6px;font:inherit;font-weight:600;color:inherit;width:100%;display:inline-flex;gap:4px;align-items:center;justify-content:flex-end;border-radius:6px}
.evcell:hover{background:var(--surface-2)}.evcellw.st-good{background:var(--good-2);color:var(--good-ink)}.evcellw.st-bad{background:var(--bad-2);color:var(--bad-ink)}.evcellw.st-warn{background:var(--warn-2);color:var(--warn-ink)}
.evcell .ic{width:14px;height:14px}.legend .ic{width:14px;height:14px;margin-right:4px}
.evwait{color:var(--warn-ink);display:flex;gap:6px;align-items:flex-start}.evwait .ic{margin-top:1px}.evwaitbox{border-color:var(--warn)}
.evmeta2{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.evmeta2 span{display:inline-flex;gap:4px;align-items:center}
.evlink{text-decoration:none;color:inherit;align-items:center;border-radius:6px}.evlink:hover{background:var(--surface-2)}.evlink>.ic{color:var(--muted)}
.evact{padding:7px 0;align-items:flex-start}.evact .t>span{display:block;overflow-wrap:anywhere}.evact>.ic{color:var(--muted);margin-top:2px}.evact-handoff>.ic,.evact-handoff .t>span:first-child{color:var(--brand);font-weight:600}.evact-comment>.ic{color:var(--s1)}
td.evwrap{white-space:normal;min-width:150px}
.evphrow{background:var(--brand-2);color:var(--brand);font-weight:600}.evgrp td{background:var(--surface-2);font-weight:600}
.evconfirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-2);color:var(--bad-ink);padding:8px 10px;border-radius:8px;margin-top:8px}.evconfirm[hidden]{display:none}
label.lb.evcheck,label.evcheck{flex-direction:row;align-items:flex-start;gap:8px;cursor:pointer}label.lb.evcheck{margin-top:22px}.evcheck input{margin-top:2px;width:16px;height:16px;flex:none}
details summary{cursor:pointer;margin-bottom:8px;font-size:12px}.evdeps{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:4px 10px;margin-bottom:10px}
.evdeps fieldset{border:0;margin:0;padding:0}.evdeps legend{padding:6px 0 2px}.evdeps label{padding:3px 0}
.rmx td.rmc,.rmx th.rmc{text-align:center;min-width:120px}.rmx .rmName{width:130px}.rmx .rml{display:inline-flex;gap:6px;align-items:center}.rmx input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.toolcat{font-size:14px;font-weight:600;color:var(--text-2);margin:6px 0 8px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:18px}
.toolcard{display:flex;flex-direction:column;padding:0;overflow:hidden;box-shadow:none}.toolcard:hover{border-color:var(--brand)}
.toolmain{background:none;border:0;text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit;flex:1;border-radius:var(--radius)}
.toolmain b{font-size:15px}.toolhost{color:var(--brand);display:inline-flex;gap:4px;align-items:center;overflow-wrap:anywhere}
.toolcard>.btn.small{margin:0 16px 12px;align-self:flex-start}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.toolname{flex:1;min-width:120px;font-size:16px}
.toolframe{display:block;width:100%;height:calc(100vh - 150px);min-height:480px;border:1px solid var(--border);border-radius:12px;background:#fff}
@media (max-width:760px){.toolframe{height:calc(100vh - 190px);min-height:420px}}
.evfs{border:1px solid var(--border);border-radius:10px;padding:10px 12px 12px;margin:0 0 10px}.evfs legend{font-weight:600;font-size:13px;padding:0 6px}
@media (max-width:760px){.evboard{grid-template-columns:1fr!important;overflow:visible}.evcol{max-height:none}}
@media (max-width:480px){.evsteps{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ===== Giao diện kiểu Attio: nền trắng, viền mảnh, chữ Inter, menu xám nhạt chia nhóm, icon màu theo loại dữ liệu ===== */
html,body{-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","ss03"}
h1,h2,h3,.tile .v{letter-spacing:-.01em}
.logo .mark{background:#1f6f43}.logo small{font-weight:500;color:var(--muted);font-size:12px}
@media (min-width:761px){.app{grid-template-columns:240px 1fr}}
nav{background:var(--surface-2);padding:12px 10px 14px;gap:1px}
.navhead{margin-bottom:6px}.navhead .logo{padding:4px 8px;font-size:14px;font-weight:600;gap:8px}.navhead .logo .mark{width:24px;height:24px;border-radius:6px;font-size:13px}

const evAdd=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))};
const evOff=o=>o===0?'Ngày D':(o<0?`D${o}`:`D+${o}`);
const evPhone=p=>String(p||'').replace(/\D/g,'').replace(/^84(?=\d{9,})/,'0');
const evFill=(t,c)=>{const e=(state.ev||{}).event||{};return t.replace(/\{ten\}/g,c&&c.name||'chị').replace(/\{sale\}/g,c&&c.sale||state.user.display_name||'[tên sale]').replace(/\{su_kien\}/g,e.name||'sự kiện').replace(/\{hashtag\}/g,e.hashtag||'#[hashtag]')};
const evDue=t=>{const e=state.ev.event;return e.date?evAdd(e.date,t.off):null};
const evCanEdit=()=>can('event_edit');
const evT=id=>state.ev.tasks.find(t=>t.id===id);
const evShort=(s,n=60)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const evDeptTag=d=>`<span class="tag d-${d}">${esc(state.ev.depts[d]||d)}</span>`;
const evLate=t=>{const d=evDue(t);return !!d&&t.status!=='done'&&d<iso(new Date())};
const evDays=d=>Math.round((new Date(iso(new Date()))-new Date(d))/864e5);
const evKpi=k=>EV_KPIS.find(x=>x[0]===k)||[k,k,''];
const evStLabel=s=>(EV_ST.find(x=>x[0]===(s||'todo'))||[,''])[1];
const evMine=t=>{const o=evNoAcc(t.owner);return !!o&&[state.user.display_name,state.user.username,state.user.sale_name].some(x=>x&&o.includes(evNoAcc(x)))};
const evCmtN=id=>state.ev.activity.filter(a=>a.kind==='comment'&&a.task_id===id).length;
// "15tr", "1,5 tỷ", "500k", "2.000.000 đ" -> số đồng; chuỗi rỗng = 0; sai định dạng = NaN
const evMoney=s=>{const v=evNoAcc(s).replace(/\s+/g,'');if(!v)return 0;const m=v.match(/^([\d.,]+)(ty|tr|trieu|k|nghin|d|dong|vnd)?$/);if(!m)return NaN;
  const mul={ty:1e9,tr:1e6,trieu:1e6,k:1e3,nghin:1e3}[m[2]]||1;return Math.round((mul>1?parseFloat(m[1].replace(',','.')):+m[1].replace(/[.,]/g,''))*mul)};
// Lỗi hiện ngay dưới ô nhập (đọc được bằng trình đọc màn hình), tự mất khi sửa
function evErr(id,msg){const i=$('#'+id);if(!i)return toast(msg);let e=$('#'+id+'-err');if(!e){e=document.createElement('span');e.id=id+'-err';e.className='ferr';e.setAttribute('role','alert');i.after(e)}
  e.textContent=msg;i.setAttribute('aria-invalid','true');i.setAttribute('aria-describedby',e.id);i.focus();i.addEventListener('input',()=>{e.remove();i.removeAttribute('aria-invalid')},{once:true});return false}

function evDraw(){

  const tasks=d.tasks,done=tasks.filter(t=>t.status==='done').length,late=tasks.filter(evLate).length,wait=tasks.filter(t=>t.status!=='done'&&t.waiting.length).length;
  const C=d.customers,moi=C.filter(c=>c.kind==='moi').length,posts=C.filter(c=>c.post).length,bought=C.filter(c=>c.rev_after>0).length;
  m.innerHTML=topbar('Sự kiện',{dates:false,sale:false,extra:`<select id="evPick" aria-label="Chọn sự kiện">${state.evList.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.name)}${x.date?' · '+dmy(x.date):''}</option>`).join('')}</select>${evCanEdit()?'<button class="btn" onclick="evForm(true)">Sửa sự kiện</button><button class="btn" onclick="evForm()">＋ Sự kiện mới</button>':''}`})+
  `<div class="row small evmeta"><span>${ic('calendar')} <b>${e.date?dmy(e.date):'Chưa đặt ngày'}</b>${e.place?' · '+esc(e.place):''}</span><span>Hashtag: <b>${esc(e.hashtag||'chưa chốt')}</b></span><span>Đang ở bước: <b style="color:var(--brand)">${EV_PH[e.phase||0][0]}</b></span><span>Việc xong: <b>${done}/${tasks.length}</b>${late?` · <b style="color:var(--bad)">${late} việc trễ hạn</b>`:''}${wait?` · <b style="color:var(--warn-ink)">${wait} việc đang chờ phòng khác</b>`:''}</span><span>Khách: <b>${C.length}</b> (mới ${moi}) · bài hashtag <b>${posts}</b> · đã mua sau sự kiện <b>${bought}</b></span></div>
  ${e.goal?`<div class="card evgoal">${ic('target')} <span><b>Mục tiêu chung:</b> ${esc(e.goal)}</span></div>`:''}
  <div class="chips" role="tablist" aria-label="Các phần của sự kiện" style="margin-bottom:14px">${EV_TABS.map(([k,l])=>`<button class="chip ${state.evTab===k?'on':''}" role="tab" aria-selected="${state.evTab===k}" onclick="state.evTab='${k}';evDraw()">${l}</button>`).join('')}</div><div id="evView" role="tabpanel"></div>`;
  $('#evPick').onchange=async ev=>{state.evPhase=null;await evLoad(+ev.target.value);evDraw()};
  ({'tong-quan':evOverview,'tien-do':evTasks,'khach':evCust,'phan-cong':evRaci,'ngan-sach':evBudget,'mau-tin':evTpls})[state.evTab]();

  const tabs=[['mine','Việc của tôi',myDept],['team',me.all?'Các phòng':me.manage?'Việc cả phòng':'Việc tôi giao',boss],['kpi','KPI',myDept||me.manage||me.all],['recur','Việc định kỳ',me.manage||me.all]].filter(t=>t[2]);
  if(!tabs.length){$('#main').innerHTML=topbar('Giao việc & KPI',{dates:false,sale:false})+`<div class="card empty"><h3 style="justify-content:center">Phòng của bạn chưa dùng giao việc trên CRM</h3><p>Đang bật cho: ${M.depts.filter(d=>d.active).map(d=>esc(d.name)).join(', ')}. Nhờ quản trị kiểm tra <b>Phòng ban</b> trong tài khoản của bạn.</p></div>`;return}
  if(!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];

  $('#main').innerHTML=topbar('Giao việc & KPI',{dates:false,sale:false,extra})+
    `<div class="tktabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" onclick="state.wk.tab='${k}';work()">${l}<span class="tkn" id="wkn_${k}" hidden></span></button>`).join('')}</div><div id="wkBody"><div class="empty">Đang tải…</div></div>`;
  bindTopbar();
  if(boss)api('/work?state=review&view=team').then(r=>{const n=$('#wkn_team');if(n&&r.items.length){n.hidden=false;n.textContent=r.items.length;n.classList.add('warn')}}).catch(()=>{});
  ({mine:wkMine,team:wkTeam,kpi:wkKpi,recur:wkRecur}[S.tab])()}

const WK_COLS=[['new','Mới giao','#1f63e0',s=>s==='new'],['doing','Đang làm','#f76b15',s=>['doing','revise','paused'].includes(s)],['review','Chờ duyệt','#8e4ec6',s=>s==='review'],['done','Đã xong','#0f9d58',s=>WK_END.includes(s)]];
function wkCard(it,opt={}){const c=it.can,drag=c.work||c.approve;
  const btn=c.work&&it.status==='new'?`<button class="btn small primary" onclick="event.stopPropagation();evRun(this,()=>wkAct(${it.id},'accept'))">Nhận việc</button>`
    :c.work&&['doing','revise'].includes(it.status)?`<button class="btn small primary" onclick="event.stopPropagation();wkDone(${it.id})">Hoàn thành</button>`
    :c.work&&it.status==='paused'?`<button class="btn small" onclick="event.stopPropagation();evRun(this,()=>wkAct(${it.id},'resume'))">Tiếp tục</button>`
    :c.approve&&it.status==='review'?`<button class="btn small primary" onclick="event.stopPropagation();evRun(this,()=>wkAct(${it.id},'approve'))">Duyệt</button><button class="btn small" onclick="event.stopPropagation();wkReason(${it.id},'revise')">Cần sửa</button>`:'';
  const st=(['revise','paused','rejected','stopped'].includes(it.status)?wkTag(it.status):'')+(it.origin==='sheet'?'<span class="tag wksheet" title="Lấy từ Google Sheet — cập nhật trên sheet">Sheet</span>':'')+(opt.dept?`<span class="tag">${esc(it.dept)}</span>`:'');
  return `<div class="evcard wkcard" data-id="${it.id}" ${drag?'draggable="true"':''} tabindex="0" role="button" aria-label="${esc(it.title)}" onclick="wkOpen(${it.id})" onkeydown="if(event.key==='Enter')wkOpen(${it.id})">
    <div class="wkct">${esc(it.title)}</div>
    ${opt.who?`<div class="wkwho">${esc(it.assignee_name)}</div>`:''}
    <div class="wkcm">${st}<span class="tag">${WK_LV[it.difficulty]?WK_LV[it.difficulty].slice(0,2):''} · ${hv(it.hours)} giờ</span>${wkDue(it)}</div>
    ${it.status==='revise'&&it.reason?`<div class="small wkwarn">Cần sửa: ${esc(it.reason)}</div>`:''}
    <div class="small muted">${esc(it.code)} · ${it.source==='self'?'🙋 tự tạo':it.source==='recurring'?'định kỳ':'giao bởi '+esc(it.assigner_name)}${it.link?` · <a href="${esc(it.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">kết quả</a>`:''}</div>
    ${btn?`<div class="row" style="gap:6px">${btn}</div>`:''}</div>`}
function wkBoard(items,opt){return `<div class="evboard wkboard">${WK_COLS.map(([k,l,c,fl])=>{let L=items.filter(i=>fl(i.status));if(k==='done')L=L.sort((a,b)=>(b.done_at||b.updated||'').localeCompare(a.done_at||a.updated||''));const more=L.length-30;
  return `<div class="evcol" data-drop="wk" data-key="${k}"><div class="evcolh"><i style="background:${c}"></i>${l}<span>${L.length}</span></div><div class="evcolb">${L.slice(0,30).map(i=>wkCard(i,opt)).join('')||'<div class="small muted wkempty">Trống</div>'}${more>0?`<div class="small muted wkempty">+ ${more} việc nữa${k==='done'?' — xem số liệu ở tab KPI':' — lọc theo người để xem hết'}</div>`:''}</div></div>`}).join('')}</div>`}
function wkFilter(items){return state.wk.late?items.filter(i=>i.due_state==='Quá hạn'):items}
function wkTools(items){const n=items.filter(i=>i.due_state==='Quá hạn').length;
  return `<button class="chip ${state.wk.late?'on':''}" onclick="state.wk.late=!state.wk.late;${state.wk.tab==='mine'?'wkMine':'wkTeam'}()">Chỉ việc quá hạn<span class="tkn ${n?'bad':''}">${n}</span></button><span class="small muted wkhint">Kéo thẻ sang cột khác để nhận việc, báo hoàn thành hoặc duyệt.</span>`}
// Kéo thả: Mới giao → Đang làm = nhận việc · → Chờ duyệt = báo hoàn thành · Chờ duyệt → Đã xong = duyệt, → Đang làm = cần sửa
function wkMove(id,to){const it=state.wkItems.find(x=>x.id===id);if(!it)return;const s=it.status,c=it.can;
  if(to==='doing'&&s==='new'&&c.work)return wkAct(id,'accept');
  if(to==='doing'&&s==='paused'&&c.work)return wkAct(id,'resume');
  if(to==='doing'&&['review','approved'].includes(s)&&c.approve)return wkReason(id,'revise');
  if(to==='review'&&['new','doing','revise'].includes(s)&&c.work)return wkDone(id);
  if(to==='done'&&s==='review'&&c.approve)return wkAct(id,'approve');
  toast(to==='done'&&c.work&&!c.approve?'Báo hoàn thành trước (kéo sang Chờ duyệt) — quản lý duyệt mới sang Đã xong':to===s||(to==='doing'&&['doing','revise'].includes(s))?'':'Không chuyển việc sang cột này được')}
function wkDnD(){let dragId=null;
  document.querySelectorAll('.wkboard .wkcard[draggable]').forEach(c=>{c.addEventListener('dragstart',x=>{dragId=+c.dataset.id;c.classList.add('dragging');x.dataTransfer.effectAllowed='move';try{x.dataTransfer.setData('text/plain',c.dataset.id)}catch(_){}});c.addEventListener('dragend',()=>c.classList.remove('dragging'))});
  document.querySelectorAll('.wkboard .evcol').forEach(col=>{col.addEventListener('dragover',x=>{x.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',x=>{if(!col.contains(x.relatedTarget))col.classList.remove('over')});
    col.addEventListener('drop',x=>{x.preventDefault();col.classList.remove('over');const id=dragId||+x.dataTransfer.getData('text/plain');dragId=null;if(id)wkMove(id,col.dataset.key)})})}
async function wkMine(){const r=await api('/work?view=mine'),s=r.summary;state.wkItems=r.items;
  const box=(l,v,c='',sub='')=>`<div class="wkbox ${c}"><span>${l}</span><b>${v}</b>${sub?`<small>${sub}</small>`:''}</div>`;
  $('#wkBody').innerHTML=`<div class="wkstrip">${box('Cần xong hôm nay',s.due_today,s.due_today?'warn':'')}${box('Chưa nhận',s.new,s.new?'info':'',s.workload_new?hv(s.workload_new)+' giờ':'')}${box('Đang làm',s.doing)}${box('Chờ duyệt',s.review)}${box('Quá hạn',s.overdue,s.overdue?'bad':'')}
    ${box('Workload hôm nay',hv(s.workload_today)+' giờ',s.workload_today>s.khoan_today&&s.khoan_today?'bad':'')}${box('Đã làm hôm nay',hv(s.hours_today)+' / '+hv(s.khoan_today)+' giờ',s.khoan_today&&s.hours_today>=s.khoan_today?'good':'')}${box('Năng lực hôm nay',s.level_today==null?'–':hv(s.level_today))}</div>
    <p class="tkhelp">Việc mới giao → bấm <b>Nhận việc</b>. Làm xong → <b>Hoàn thành</b> (dán link kết quả) để được tính giờ KPI ngay hôm đó. Sếp giao miệng → <b>＋ Tự tạo việc</b>.</p>`+`<div class="row wkbar">${wkTools(r.items)}</div>`+wkBoard(wkFilter(r.items),{});wkDnD()}
function wkDeptBar(withAll){const M=state.wkMeta,S=state.wk;if(!M.me.all)return '';const D=M.depts.filter(d=>d.active);
  return `<div class="chips wkdepts" role="group" aria-label="Phòng ban">${withAll?`<button class="chip ${!S.tdept?'on':''}" onclick="state.wk.tdept='';state.wk.who='';wkTeam()">Tất cả phòng</button>`:''}${D.map(d=>`<button class="chip ${(withAll?S.tdept:S.dept)===d.code?'on':''}" onclick="${withAll?`state.wk.tdept='${d.code}';state.wk.who='';wkTeam()`:`state.wk.dept='${d.code}';wkKpi()`}">${esc(d.name)}</button>`).join('')}</div>`}
function wkSyncInfo(code){const M=state.wkMeta,d=M.depts.find(x=>x.code===code);if(!d||!d.cfg.sheet_id||!(M.me.admin||(M.me.manage&&M.me.dept===code)||M.me.all))return '';const s=d.sync||{};
  return `<span class="small muted">${s.error?`<span class="wkwarn">Lỗi đồng bộ: ${esc(s.error)}</span>`:s.at?`Đồng bộ sheet lúc ${dhm(s.at)}`:'Chưa đồng bộ sheet'}</span><button class="btn small" onclick="evRun(this,()=>wkSync('${code}'))">${ic('arrow')} Đồng bộ sheet</button>`}
async function wkSync(code){const r=await api('/work/sync',{method:'POST',body:{dept:code}});const un=Object.keys(r.unmatched||{}).filter(k=>r.unmatched[k]);
  toast(`Đã đồng bộ: ${r.created} việc mới, ${r.updated} việc cập nhật${un.length?` · ${un.length} tên chưa khớp tài khoản`:''}`);work()}
async function wkTeam(){const M=state.wkMeta,S=state.wk;const dsel=M.me.all?(S.tdept||''):M.me.dept;
  const r=await api('/work?view=team&who='+encodeURIComponent(S.who||'')+'&dept='+encodeURIComponent(M.me.all?dsel:''));state.wkItems=r.items;
  const ppl=M.people.filter(p=>M.me.all?(dsel?p.dept===dsel:M.depts.some(d=>d.active&&d.code===p.dept)):p.dept===M.me.dept);
  $('#wkBody').innerHTML=wkDeptBar(1)+`<div class="row wkbar"><select class="f" aria-label="Lọc theo người" onchange="state.wk.who=this.value;wkTeam()"><option value="">Tất cả mọi người</option>${ppl.map(p=>`<option value="${esc(p.username)}" ${S.who===p.username?'selected':''}>${esc(p.name)}${M.me.all?' · '+esc(wkDept(p.dept)):''}</option>`).join('')}</select>${wkTools(r.items)}${wkSyncInfo(dsel||M.me.dept)}</div>`+wkBoard(wkFilter(r.items),{who:1,dept:M.me.all&&!dsel});wkDnD()}

function wkDone(id){const it=state.wkItems.find(x=>x.id===id);
  evModal(`<div class="row"><h2 style="flex:1;margin:0;font-size:17px">Báo hoàn thành</h2><button class="btn" onclick="closeModal()">${ic('x')} Đóng</button></div>

function wkReason(id,a){const it=state.wkItems.find(x=>x.id===id);
  evModal(`<div class="row"><h2 style="flex:1;margin:0;font-size:17px">${a==='revise'?'Trả về cần sửa':'Không duyệt'}</h2><button class="btn" onclick="closeModal()">${ic('x')} Đóng</button></div>
  <p class="small muted" style="margin:6px 0 14px">${esc(it.code)} · ${esc(it.title)} · ${esc(it.assignee_name)}</p>
  <label class="lb">Lý do <span class="req" aria-hidden="true">*</span><textarea class="f" id="wkWhy" rows="3" placeholder="${a==='revise'?'Cần sửa gì để duyệt được':'Vì sao không duyệt'}"></textarea></label>
  ${a==='revise'?'<p class="small muted">Mỗi lần cần sửa trừ 10% điểm thực tế (không trừ KPI giờ).</p>':''}
  <button class="btn ${a==='revise'?'primary':'danger'}" onclick="evRun(this,()=>{const w=$('#wkWhy').value.trim();if(!w)return evErr('wkWhy','Ghi lý do');return wkAct(${id},'${a}',{reason:w})})">${a==='revise'?'Trả về cần sửa':'Không duyệt'}</button>`);$('#modalBody').style.width='min(520px,100%)'}
async function wkAct(id,action,extra={}){await api(`/work/${id}/act`,{method:'POST',body:{action,...extra}});
  closeModal();toast({accept:'Đã nhận việc',done:'Đã báo hoàn thành — chờ duyệt',approve:extra.good?'Đã duyệt – hoàn thành tốt':'Đã duyệt',revise:'Đã trả về cần sửa',reject:'Đã không duyệt',pause:'Đã tạm dừng',resume:'Đã tiếp tục',stop:'Đã dừng việc'}[action]||'Đã lưu');work()}

function wkPeriod(){const S=state.wk,t=new Date(),d=new Date(t);let f,e=t;
  if(S.period==='week'){const k=(t.getDay()+6)%7;f=new Date(t);f.setDate(t.getDate()-k)}
  else if(S.period==='month')f=new Date(t.getFullYear(),t.getMonth(),1);
  else if(S.period==='last'){f=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0)}
  else return [S.from||iso(new Date(t.getFullYear(),t.getMonth(),1)),S.to||iso(t)];
  return [iso(f),iso(e)]}

    ${S.period==='custom'?`<input type="date" class="f" value="${f}" onchange="state.wk.from=this.value;wkKpi()" aria-label="Từ ngày"> → <input type="date" class="f" value="${e}" onchange="state.wk.to=this.value;wkKpi()" aria-label="Đến ngày">`:''}

  ${k.rows.length?`<div class="tablewrap" style="max-height:none"><table><thead><tr><th>Nhân sự</th><th class="r" title="Việc ĐÃ DUYỆT có ngày hoàn thành trong kỳ">Việc đã duyệt</th><th class="r">% đúng hạn</th><th class="r">Quá hạn chưa xong</th><th class="r">Chưa nhận</th><th class="r">Giờ khoán</th><th class="r" title="Giờ chuẩn của việc đã báo hoàn thành (chờ duyệt + đã duyệt)">Giờ đã làm</th><th class="r">KPI năng suất</th><th>Xếp loại</th><th class="r" title="Độ khó trung bình theo giờ">Năng lực</th><th class="r">Điểm tiêu chuẩn</th><th class="r">Điểm thực tế</th></tr></thead>
    <tbody>${k.rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="small muted">${r.manager?'Quản lý':'Nhân viên'}</div></td><td class="r">${r.tasks}</td><td class="r">${r.ontime_pct==null?'–':hv(r.ontime_pct)+'%'}<div class="small muted">${r.ontime} đúng · ${r.late} trễ</div></td>

const RM_H0=7,RM_H1=20,RM_PX=44;                 // lưới giờ 7:00–20:00, 44px mỗi giờ
const RM_WD=['T2','T3','T4','T5','T6','T7','CN'];
const rmMin=s=>+s.slice(11,13)*60+ +s.slice(14,16);
const rmHM=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const rmWeekOf=d=>{const a=new Date(d+'T00:00'),k=(a.getDay()+6)%7;a.setDate(a.getDate()-k);return [...Array(7)].map((_,i)=>{const x=new Date(a);x.setDate(a.getDate()+i);return iso(x)})};
const rmRoom=id=>(state.rmData.rooms.find(r=>r.id===id))||{name:'?',color:'#6b6d72'};
const INTERNAL_TOOLS={'crm:phong-hop':t=>roomsPage(t)};

async function roomsPage(t){if(t)state.rmTool=t;state.rm=state.rm||{day:iso(new Date()),room:''};await rmLoad()}
async function rmLoad(){const D=rmWeekOf(state.rm.day);state.rmData=await api(`/rooms?from_d=${D[0]}&to_d=${D[6]}`);rmDraw(D)}
function rmWeek(n){const S=state.rm;if(!n)S.day=iso(new Date());else{const a=new Date(S.day+'T00:00');a.setDate(a.getDate()+7*n);S.day=iso(a)}rmLoad()}
function rmLanes(L){const ends=[];return L.map(b=>{const s=rmMin(b.start_at);let k=ends.findIndex(e=>e<=s);if(k<0){k=ends.length;ends.push(0)}ends[k]=rmMin(b.end_at);return [b,k]}).map((x,_,all)=>[...x,ends.length])}
function rmDraw(D){const d=state.rmData,S=state.rm,R=d.rooms.filter(r=>r.active),today=d.now.slice(0,10),nowM=rmMin(d.now);
  const B=d.bookings.filter(b=>!S.room||b.room_id===+S.room);

async function board(){
  const m=$('#main');const basis=state.basis||'';const wk=state.weekly?'&weekly=1':'';
  const d=await api(`/board?from=${state.from}&to=${state.to}${wk}`+(basis?'&basis='+basis:''));

  const C=d.cats;const money=v=>v?fmt(v):'–';

  const col=p=>p==null?'var(--muted)':p>=100?'var(--good)':p>=80?'var(--warn)':'var(--bad)';
  const pctCell=p=>p==null?'<span class="muted">–</span>':`<b style="color:${col(p)}">${p}%</b>`;
  const cell=(v,p)=>`<td class="r">${money(v)}${p!=null?`<br><span class="small" style="color:${col(p)}">${p}%</span>`:''}</td>`;
  const byTeam={};d.rows.forEach(r=>(byTeam[r.team]=byTeam[r.team]||[]).push(r));
  const W=d.weeks||[];
  const head=`<tr><th>Team / Sale</th><th class="r">Mục tiêu</th><th class="r">DS khách sale</th>${C.map(c=>`<th class="r">${c[1]}<br><span class="small muted">${d.alloc[c[0]]||0}%</span></th>`).join('')}<th class="r">Bán cho KH mới<br><span class="small muted">${d.alloc.new_customer||0}%</span></th><th class="r">DS khách sếp</th>${W.map(w=>`<th class="r">Tuần ${w.week}</th>`).join('')}<th class="r">Hàng trả</th><th class="r">HĐ huỷ</th><th class="r">TỔNG</th><th class="r">% KPI</th><th>Tình trạng</th></tr>`;
  const line=(r,isTeam)=>`<tr ${isTeam?'style="background:var(--brand-2);font-weight:600"':''}><td ${isTeam?'':'style="padding-left:22px"'}>${isTeam?'TỔNG TEAM '+esc(r.team).toUpperCase():esc(r.sale)}</td>
    <td class="r ${isTeam?'':'muted'}">${money(r.target)}</td><td class="r">${money(r.rev_sale)}</td>
    ${C.map(c=>cell(r[c[0]],r[c[0]+'_pct'])).join('')}${cell(r.new_customer_rev,r.new_customer_pct)}
    <td class="r">${money(r.rev_boss)}</td>${(r.weeks||[]).map(v=>`<td class="r">${money(v)}</td>`).join('')}
    <td class="r" style="color:${r.returns?'var(--bad)':'var(--muted)'}">${r.returns?'−'+fmt(r.returns):'–'}</td>
    <td class="r" title="Hoá đơn đã huỷ trên KiotViet — không tính vào doanh số">${r.cancelled?`<span class="muted">${fmt(r.cancelled)}</span><br><span class="small muted">${r.cancelled_n} HĐ</span>`:'<span class="muted">–</span>'}</td>
    <td class="r"><b>${money(r.total)}</b></td><td class="r">${pctCell(r.pct)}</td><td>${st(r.status)}</td></tr>`;
  const body=d.teams.map(g=>line(g,true)+(byTeam[g.team]||[]).map(r=>line(r,false)).join('')).join('');
  const T=k=>d.rows.reduce((a,r)=>a+(r[k]||0),0);
    m.innerHTML=topbar('Bảng doanh số',{sale:false,extra:(isMgr()?`<select class="f" id="fBasis"><option value="accounting" ${d.basis==='accounting'?'selected':''}>Như kế toán đang tính (khuyến nghị)</option><option value="customer" ${d.basis==='customer'?'selected':''}>Tất cả theo sale phụ trách khách</option><option value="invoice" ${d.basis==='invoice'?'selected':''}>Tất cả theo người bán trên hoá đơn</option></select>`:'')+`<label class="small" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="fWeek" ${state.weekly?'checked':''}> theo tuần</label>`+(isMgr()?`<label class="small" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="gRepB"> ghi đè</label><button class="btn" id="bGsB" title="Xuất sang Google Sheet đúng khoảng ngày đang chọn">⬇ Google Sheet</button>`:'')})+
  `<div class="grid g4"><div class="card tile"><h3>Doanh số thực</h3><div class="v">${fmtK(T('total'))}</div><div class="d">bán ${fmtK(T('gross'))} − trả ${fmtK(T('returns'))}</div></div>
   <div class="card tile"><h3>Mục tiêu</h3><div class="v">${fmtK(T('target'))}</div><div class="d">${T('target')?'đạt '+Math.round(T('total')/T('target')*100)+'%':'chưa đặt chỉ tiêu'} · <a href="#kpi">đặt</a></div></div>
   <div class="card tile"><h3>Độc quyền (mới + cũ)</h3><div class="v">${fmtK(T('excl_new')+T('excl_old'))}</div><div class="d">mới ${fmtK(T('excl_new'))} · cũ ${fmtK(T('excl_old'))}</div></div>
   <div class="card tile"><h3>Khách sếp</h3><div class="v">${fmtK(T('rev_boss'))}</div><div class="d">khách sale ${fmtK(T('rev_sale'))}</div></div></div>
  <div class="card" style="margin-top:14px"><h3>Bảng doanh số ${dmy(d.from)} – ${dmy(d.to)} <span class="x">${d.basis==='accounting'?'khách sale theo người bán trên HĐ · khách sếp theo sale phụ trách':d.basis==='invoice'?'tính theo người bán ghi trên hoá đơn':'tính theo sale phụ trách khách (đuôi tên)'} · khách sếp đã trừ hàng trả, khách sale tính gộp</span></h3>

   <p class="small muted">% dưới mỗi nhóm hàng là mức đạt so với phần chỉ tiêu phân bổ cho nhóm đó (sửa tỷ lệ trong Cài đặt). Cột nhóm hàng và "bán cho khách mới" tính trên phần khách sale; "khách mới" theo dõi riêng, không cộng vào tổng.</p></div>`;
  const BD=d.boss_daily;
  if(BD&&BD.rows.length){const DW=['CN','T2','T3','T4','T5','T6','T7'];const z=v=>v?fmt(v):'<span class="muted">–</span>';
    const hd=BD.days.map(x=>{const w=new Date(x+'T00:00:00').getDay();return `<th class="r" ${w===0?'style="color:var(--bad)"':''}>${x.slice(8)}/${x.slice(5,7)}<br><span class="small muted">${DW[w]}</span></th>`}).join('');

    ${BD.rows.map(r=>`<tr ${r.no_kpi?'style="opacity:.6"':''}><td class="name" style="position:sticky;left:0;background:var(--surface)"><a href="#" onclick="openCustomer(${r.id});return false"><b>${esc(r.name)}</b></a><br><span class="small muted">${esc(r.code)}</span>${r.no_kpi?' <span class="tag warn">K áp KPI · không cộng tổng</span>':''}</td><td>${esc(r.sale)}</td><td class="r"><b>${z(r.total)}</b></td><td class="r" style="color:${r.returns?'var(--bad)':'inherit'}">${r.returns?'−'+fmt(r.returns):'<span class="muted">–</span>'}</td><td class="r">${r.invoices||'<span class="muted">–</span>'}</td>${r.daily.map(v=>`<td class="r" ${v<0?'style="color:var(--bad)"':''}>${z(v)}</td>`).join('')}</tr>`).join('')}
    <tr style="background:var(--brand-2);font-weight:600"><td style="position:sticky;left:0;background:var(--brand-2)">TỔNG KHÁCH SẾP</td><td></td><td class="r">${fmt(BD.total)}</td><td class="r">${BD.returns?'−'+fmt(BD.returns):'–'}</td><td></td>${BD.day_total.map(v=>`<td class="r">${z(v)}</td>`).join('')}</tr></tbody></table></div>

    ${cl.map(r=>`<tr><td>${esc(r.code)}</td><td>${dmy(r.d)}</td><td>${esc(r.customer)}</td><td>${esc(r.sale||'')}</td><td>${r.is_boss?'<span class="tag">Khách sếp</span>':'Khách sale'}</td><td class="r">${fmt(r.total)}</td></tr>`).join('')}
    </tbody></table></div></div>`);

}

// Trang Công việc: một danh sách duy nhất + 3 tab (Việc cần làm · Gợi ý từ hệ thống · Đã xong)
const TK_TYPE={call:'Gọi điện',visit:'Ghé thăm',message:'Nhắn tin',birthday:'Chúc sinh nhật',reorder:'Nhắc mua lại',winback:'Kéo lại KH',debt:'Nhắc công nợ',other:'Khác'};

const TK_SUG={debt:['Công nợ quá hạn','Khách đang nợ quá hạn — nhắc khách thanh toán'],birthday:['Sinh nhật trong 7 ngày tới','Gửi lời chúc, giữ quan hệ với khách'],
  reorder:['Đến kỳ mua lại','Đã quá chu kỳ mua thông thường của khách'],winback:['Khách giá trị đang ngừng mua','Từng mua nhiều nhưng 3–6 tháng nay chưa quay lại']};
const tkPhone=s=>{const m=String(s||'').match(/0\d{9,10}/);return m?m[0]:''};
const tkDays=s=>Math.round((new Date(String(s).slice(0,10))-new Date(iso(new Date())))/864e5);
const tkWho=t=>t.customer_name?`<a href="#" onclick="event.stopPropagation();openCustomer(${t.customer_id});return false">${esc(t.customer_name)}</a>`

const tkAct=(f,id,txt,cls='')=>`<button class="btn small ${cls}" onclick="evRun(this,()=>${f})">${txt}</button>`;

async function tasks(){
  const P=window._tkP=await api('/tasks/people');
  if(state.tkWho===undefined||(state.tkWho&&!P.people.some(p=>p.value===state.tkWho)))state.tkWho=P.default;   // mặc định: quản lý xem tất cả, nhân viên xem việc của mình
  const q=encodeURIComponent(state.tkWho);
  const [open,sug]=await Promise.all([api('/tasks?status=open&sale='+q),api('/tasks/suggest?sale='+q)]);
  window._tk={open,sug:sug.filter(x=>!x.exists),q};window._sug=sug;
  if(!state.tk)state.tk={tab:'open',f:'all',more:{}};
  tkDraw()}
function tkDraw(){
  const K=window._tk,S=state.tk,open=K.open,od=open.filter(t=>t.overdue),td=open.filter(t=>t.today&&!t.overdue),up=open.filter(t=>!t.overdue&&!t.today);
  const tabs=[['open','Việc cần làm',open.length],['sug','Gợi ý từ hệ thống',K.sug.length],['done','Đã xong',null]];
  let body='';
  if(S.tab==='open'){
    const fl=[['all','Tất cả',open.length,''],['od','Quá hạn',od.length,'bad'],['td','Hôm nay',td.length,'warn'],['up','Sắp tới',up.length,'']];
    const secs=[['od','Quá hạn',od,'bad'],['td','Hôm nay',td,'warn'],['up','Sắp tới',up,'']].filter(s=>S.f==='all'||S.f===s[0]);
    const shown=secs.reduce((a,s)=>a+s[2].length,0);
    body=`<div class="chips tkchips">${fl.map(([k,l,n,c])=>`<button class="chip ${S.f===k?'on':''}" onclick="tkF('${k}')">${l}<span class="tkn ${S.f===k?'':c}">${n}</span></button>`).join('')}</div>`+
    (shown?`<div class="tklist">${secs.filter(s=>s[2].length).map(([k,l,list,c])=>{const lim=S.more[k]?list.length:20;
      return `<div class="tkh ${c}">${l} <span class="tkn">${list.length}</span></div>${list.slice(0,lim).map(tkRow).join('')}${list.length>lim?`<button class="tkmore" onclick="tkMore('${k}')">Xem thêm ${list.length-lim} việc</button>`:''}`}).join('')}</div>`
      :`<div class="card empty"><h3 style="justify-content:center">${open.length?'Không có việc nào ở mục này':'Bạn đã làm hết việc 🎉'}</h3><p>${K.sug.length?`Hệ thống tìm được <b>${K.sug.length}</b> khách nên chăm sóc.`:'Bấm “Thêm việc” để tạo việc mới.'}</p>${K.sug.length?'<button class="btn primary" onclick="tkTab(\'sug\')">Xem gợi ý</button>':''}</div>`);
  }else if(S.tab==='sug'){
    const keys=Object.keys(TK_SUG).filter(k=>K.sug.some(x=>x.kind===k));
    body=`<p class="tkhelp" style="margin-top:0">Hệ thống tự rà dữ liệu bán hàng và đề xuất khách nên liên hệ. Bấm <b>+ Thêm việc</b> để đưa vào danh sách của bạn; không thêm thì không có gì thay đổi.</p>`+
    (keys.length?keys.map(k=>{const l=K.sug.filter(x=>x.kind===k),lim=S.more['s'+k]?l.length:8;
      return `<div class="sg"><div class="sgh"><div><b>${TK_SUG[k][0]}</b> <span class="tkn">${l.length}</span><div class="small muted">${TK_SUG[k][1]}</div></div>${tkAct(`addSug('${k}')`,0,`Thêm cả nhóm (${l.length})`)}</div>
      ${l.slice(0,lim).map(x=>`<div class="sgi"><div class="tkb"><div class="tkt"><a href="#" onclick="openCustomer(${x.customer_id});return false">${esc(x.customer_name)}</a> <span class="muted small">${esc(tkPhone(x.phone)||'')}</span></div><div class="tkm">${esc(x.reason)}${state.user.scope!=='own'?' · '+esc(x.sale):''}</div></div>${tkAct(`addSug(${JSON.stringify(x.auto_key).replace(/"/g,'&quot;')})`,0,'+ Thêm việc')}</div>`).join('')}
      ${l.length>lim?`<button class="tkmore" onclick="tkMore('s${k}')">Xem thêm ${l.length-lim} khách</button>`:''}</div>`}).join('')
      :'<div class="card empty"><h3 style="justify-content:center">Chưa có gợi ý mới</h3><p>Gợi ý tự cập nhật theo dữ liệu bán hàng.</p></div>');
  }else body='<div class="card" id="tkHist"><div class="empty">Đang tải…</div></div>';
  const P=window._tkP,who=P.people.length>1?`<select id="tkWho" class="f" aria-label="Xem việc của" onchange="state.tkWho=this.value;tasks()"><option value="" ${state.tkWho===''?'selected':''}>${P.all?'Tất cả mọi người':'Cả team'}</option><option value="${esc(P.me)}" ${state.tkWho===P.me?'selected':''}>Việc của tôi</option>${P.people.filter(p=>p.value!==P.me).map(p=>`<option value="${esc(p.value)}" ${state.tkWho===p.value?'selected':''}>${esc(p.label)}</option>`).join('')}</select>`:'';
  $('#main').innerHTML=topbar('Công việc',{dates:false,sale:false,extra:who+'<button class="btn primary" onclick="newTask()">＋ Thêm việc</button>'})+
    `<p class="tkhelp">Việc cần làm với khách hàng. Làm xong thì bấm vòng tròn <span class="tkchk tkdemo"></span> bên trái để ghi kết quả; bấm vào dòng việc để dời hạn hoặc bỏ.</p>
    <div class="tktabs" role="tablist">${tabs.map(([k,l,n])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" onclick="tkTab('${k}')">${l}${n==null?'':`<span class="tkn">${n}</span>`}</button>`).join('')}</div>${body}`;
  bindTopbar();if(S.tab==='done')tkHist()}
function tkRow(t){const d=tkDays(t.due_date),lbl=d<0?`Trễ ${-d} ngày`:d===0?'Hôm nay':d===1?'Ngày mai':dmy(t.due_date),cls=d<0?'bad':d===0?'warn':'',ph=tkPhone(t.contact_number||t.lead_phone);
  return `<div class="tk" onclick="taskModal(${t.id})"><button class="tkchk" aria-label="Hoàn thành: ${esc(t.title)}" onclick="event.stopPropagation();taskModal(${t.id})"></button>
    <div class="tkb"><div class="tkt">${esc(t.title)}</div><div class="tkm">${tkWho(t)}${ph?` · <a href="tel:${ph}" onclick="event.stopPropagation()">${ph}</a>`:''}${state.tkWho!==window._tkP.me&&t.assigned_to?' · '+esc(tkName(t.assigned_to)):''}</div></div>
    <div class="tkr"><span class="tag">${esc(TK_TYPE[t.type]||t.type)}</span><span class="tkdue ${cls}">${lbl}</span></div></div>`}
const tkName=v=>((window._tkP.people.find(p=>p.value===v))||{label:v}).label;
function tkTab(k){state.tk.tab=k;tkDraw()}
function tkF(k){state.tk.f=k;tkDraw()}
function tkMore(k){state.tk.more[k]=1;tkDraw()}
async function tkHist(){const h=await api('/tasks?status=done&sale='+window._tk.q),el=$('#tkHist');if(!el)return;
  el.innerHTML=`<h3>Đã xong hoặc đã bỏ <span class="x">${h.length} việc gần nhất</span></h3>`+(h.length?`<div class="tablewrap"><table><thead><tr><th>Việc</th><th>Khách</th><th>Sale</th><th>Hạn</th><th>Xong lúc</th><th>Kết quả</th><th>TT</th></tr></thead><tbody>${h.map(t=>`<tr><td class="name">${esc(t.title)}</td><td>${esc(t.customer_name||t.lead_name||'')}</td><td>${esc(t.assigned_to||'')}</td><td>${dmy(t.due_date)}</td><td>${(t.done_at||'').replace('T',' ').slice(0,16)}</td><td class="name">${esc(t.result||'')}</td><td><span class="tag ${t.status==='done'?'good':''}">${t.status==='done'?'Xong':'Bỏ'}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có việc nào hoàn thành.</div>')}
function taskModal(id){const t=window._tk.open.find(x=>x.id===id);if(!t)return;const ph=tkPhone(t.contact_number||t.lead_phone);
  evModal(`<div class="row"><h2 style="flex:1;margin:0;font-size:17px">${esc(t.title)}</h2><button class="btn" onclick="closeModal()">${ic('x')} Đóng</button></div>
  <p class="small muted" style="margin:6px 0 16px">${tkWho(t)}${ph?` · <a href="tel:${ph}">${ph}</a>`:''} · hạn ${dmy(t.due_date)}${t.assigned_to?' · '+esc(tkName(t.assigned_to)):''}</p>
  <div class="tkh2">Kết quả <span class="muted">(không bắt buộc)</span></div>
  <div class="chips" id="tkRes">${TK_RESULTS.map(r=>`<button type="button" class="chip" aria-pressed="false" onclick="tkPick(this)">${r}</button>`).join('')}</div>
  <input class="f" id="tkNote" placeholder="Ghi chú thêm…" style="width:100%;margin:10px 0 14px" aria-label="Ghi chú">
  <button class="btn primary" onclick="evRun(this,()=>tkDone(${id}))">${ic('tasks')} Đã làm xong</button>
  <div class="tkhr"></div>
  <div class="tkh2">Chưa làm được? Dời hạn sang</div>
  <div class="row"><button class="btn small" onclick="evRun(this,()=>tkMove(${id},1))">Ngày mai</button><button class="btn small" onclick="evRun(this,()=>tkMove(${id},3))">3 ngày nữa</button><button class="btn small" onclick="evRun(this,()=>tkMove(${id},7))">1 tuần nữa</button>
    <input class="f" type="date" id="tkDate" aria-label="Chọn ngày" style="padding:4px 8px"><button class="btn small" onclick="evRun(this,()=>tkMove(${id},0))">Dời</button></div>
  ${window._tkP.people.length>1?`<div class="tkhr"></div><div class="tkh2">Giao lại cho người khác</div><div class="row"><select class="f" id="tkAsg" aria-label="Người nhận việc">${window._tkP.people.map(p=>`<option value="${esc(p.value)}" ${p.value===t.assigned_to?'selected':''}>${esc(p.label)}</option>`).join('')}</select><button class="btn small" onclick="evRun(this,()=>tkAssign(${id}))">Giao</button></div>`:''}
  <div class="tkhr"></div>
  <button class="btn small danger" onclick="$('#tkDel').hidden=false">Bỏ việc này</button>
  <div id="tkDel" class="evconfirm" hidden>Bỏ hẳn việc này (không làm nữa)? <button class="btn small" onclick="$('#tkDel').hidden=true">Không</button><button class="btn small danger" onclick="evRun(this,()=>tkCancel(${id}))">Bỏ việc</button></div>`);
  $('#modalBody').style.width='min(520px,100%)'}
function tkPick(b){const on=b.classList.contains('on');document.querySelectorAll('#tkRes .chip').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-pressed','false')});if(!on){b.classList.add('on');b.setAttribute('aria-pressed','true')}}
async function tkDone(id){const c=document.querySelector('#tkRes .chip.on'),n=$('#tkNote').value.trim(),r=[c&&c.textContent,n].filter(Boolean).join(' — ');
  await api('/tasks',{method:'POST',body:{id,status:'done',result:r}});closeModal();toast('Đã hoàn thành');tasks()}
async function tkMove(id,days){const t=window._tk.open.find(x=>x.id===id);if(!t)return;let d;
  if(days)d=iso(new Date(Date.now()+days*864e5));else{d=$('#tkDate').value;if(!d)return evErr('tkDate','Chọn ngày muốn dời tới')}
  await api('/tasks',{method:'POST',body:{id,title:t.title,type:t.type,due_date:d,assigned_to:t.assigned_to,priority:t.priority}});closeModal();toast('Đã dời hạn tới '+dmy(d));tasks()}
async function tkAssign(id){const t=window._tk.open.find(x=>x.id===id),to=$('#tkAsg').value;if(!t||to===t.assigned_to){closeModal();return}
  await api('/tasks',{method:'POST',body:{id,title:t.title,type:t.type,due_date:t.due_date,assigned_to:to,priority:t.priority}});closeModal();toast('Đã giao việc cho '+tkName(to));tasks()}
async function tkCancel(id){await api('/tasks',{method:'POST',body:{id,status:'cancelled'}});closeModal();toast('Đã bỏ việc');tasks()}
async function addSug(k){const items=(window._sug||[]).filter(x=>!x.exists&&(k==='all'||x.kind===k||x.auto_key===k)).map(x=>({customer_id:x.customer_id,title:x.title,type:x.type,due_date:x.due_date,assigned_to:x.sale==='(Chưa gán)'?'':x.sale,auto_key:x.auto_key,priority:x.priority}));
  if(items.length>20&&!confirm(`Thêm ${items.length} việc vào danh sách?`))return;
  const r=await api('/tasks/bulk',{method:'POST',body:{items}});toast('Đã thêm '+r.created+' việc');tasks()}
async function newTask(cid,lid){if(!window._tkP)window._tkP=await api('/tasks/people');const P=window._tkP,mb=$('#modalBody');
  mb.innerHTML=`<div class="row"><h2 style="margin:0;flex:1">Thêm việc</h2><button class="btn" onclick="closeModal()">✕</button></div>

  ${cid||lid?'':`<label>Khách (tìm theo tên/SĐT)<br><input class="f" id="tCust" list="custList" style="width:100%" placeholder="gõ để tìm…"><datalist id="custList"></datalist></label>`}</div>

   <div class="card tile"><h3>Thời gian đã qua</h3><div class="v">${d.time_pct}%</div><div class="d">ngày ${d.days_passed}/${d.days_total} — đạt ≥ ${d.time_pct}% là đúng tiến độ</div></div>
   <div class="card tile"><h3>KH mới</h3><div class="v">${fmt(tot('new_customers'))}</div><div class="d">chỉ tiêu ${fmt(tot('new_customers_target'))}</div></div>

const LOST=['Giá cao','Không phản hồi','Chọn bên khác','Chưa có nhu cầu','Không đủ vốn nhập','Hết hàng / không có mã cần'];
const LSTAT=[['new','Mới'],['contacted','Đã liên hệ'],['consulting','Đang tư vấn'],['won','Đã chốt'],['lost','Thất bại']];
async function leads(){
  const m=$('#main');const sale=state.user.scope==='own'?'':state.sale;

  const F=st.funnel||{};const won=F.won||0,closed=won+(F.lost||0);
  const PROB={new:.1,contacted:.3,consulting:.6};const open=rows.filter(r=>PROB[r.status]!=null);
  const pipe=open.reduce((a,r)=>a+(r.value||0),0),fc=open.reduce((a,r)=>a+(r.value||0)*PROB[r.status],0);
  const noVal=open.filter(r=>!r.value).length;const now=Date.now();
  const idle=r=>PROB[r.status]!=null&&r.updated?Math.floor((now-new Date(r.updated))/864e5):0;
  m.innerHTML=topbar('Khách tiềm năng',{dates:false,extra:`<input class="f" id="fQ" placeholder="Tìm tên / SĐT"><button class="btn primary" id="bNew">+ Thêm khách</button><button class="btn" id="bImp">Dán từ Excel</button>`})+
  `<div class="grid g4 g5"><div class="card tile"><h3>Cơ hội đang theo</h3><div class="v">${fmtK(pipe)}</div><div class="d">${open.length} khách${noVal?` · <span style="color:var(--warn)">${noVal} chưa nhập giá trị</span>`:''}</div></div>
   <div class="card tile"><h3>Dự báo chốt</h3><div class="v">${fmtK(fc)}</div><div class="d">mới 10% · đã liên hệ 30% · đang tư vấn 60%</div></div>
   <div class="card tile"><h3>Đã chốt (90 ngày)</h3><div class="v" style="color:var(--good)">${won}</div><div class="d">giá trị ${fmtK(st.by_sale.reduce((a,r)=>a+r.won_value,0))}</div></div>
   <div class="card tile"><h3>Tỷ lệ chốt</h3><div class="v">${closed?Math.round(won/closed*100)+'%':'–'}</div><div class="d">trên số đã kết thúc (${closed})</div></div>
   <div class="card tile"><h3>Thất bại</h3><div class="v" style="color:var(--bad)">${F.lost||0}</div><div class="d">${(st.lost_reasons[0]||{}).k?'lý do nhiều nhất: '+esc(st.lost_reasons[0].k):''}</div></div></div>
  <div class="card" style="margin-top:14px"><h3>Phễu <span class="x">bấm thẻ để mở; đổi trạng thái trong thẻ</span></h3><div class="kanban" id="kb"></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Theo sale (90 ngày)</h3><table><thead><tr><th>Sale</th><th class="r">Lead</th><th class="r">Chốt</th><th class="r">Thất bại</th><th class="r">Tỷ lệ</th><th class="r">Giá trị chốt</th></tr></thead><tbody>${st.by_sale.map(r=>`<tr><td>${esc(r.k)}</td><td class="r">${r.n}</td><td class="r" style="color:var(--good)">${r.won}</td><td class="r" style="color:var(--bad)">${r.lost}</td><td class="r">${r.won+r.lost?Math.round(r.won/(r.won+r.lost)*100)+'%':'–'}</td><td class="r">${fmt(r.won_value)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">–</td></tr>'}</tbody></table></div>
   <div class="card"><h3>Theo nguồn (90 ngày)</h3><table><thead><tr><th>Nguồn</th><th class="r">Lead</th><th class="r">Chốt</th><th class="r">Tỷ lệ</th><th class="r">Giá trị</th></tr></thead><tbody>${st.by_source.map(r=>`<tr><td>${esc(r.k)}</td><td class="r">${r.n}</td><td class="r">${r.won}</td><td class="r">${r.won+r.lost?Math.round(r.won/(r.won+r.lost)*100)+'%':'–'}</td><td class="r">${fmt(r.won_value)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">–</td></tr>'}</tbody></table>
   ${st.lost_reasons.length?`<h3 style="margin-top:12px">Lý do thất bại</h3>${st.lost_reasons.map(r=>`<div class="small">${esc(r.k)} <b>${r.n}</b></div>`).join('')}`:''}</div></div>`;
  bindTopbar();
  const draw=()=>{const q=($('#fQ').value||'').toLowerCase();const f=rows.filter(r=>!q||(r.name||'').toLowerCase().includes(q)||(r.phone||'').includes(q));
    $('#kb').innerHTML=LSTAT.map(([k,l])=>{const list=f.filter(r=>r.status===k);const sum=list.reduce((a,r)=>a+(r.value||0),0);return `<div class="col"><h4>${l}<span class="muted">${list.length}${sum?' · '+fmtK(sum):''}</span></h4>${list.slice(0,40).map(r=>`<div class="lead" onclick="openLead(${r.id})"><b>${esc(r.name)}</b><span class="m">${esc(r.phone||'')} ${r.source?'· '+esc(r.source):''}</span><span class="m">${esc(r.sale||'')}${r.value?' · '+fmtK(r.value):''}${r.next_date?' · ⏰ '+dmy(r.next_date):''}</span>${idle(r)>7?`<span class="m" style="color:var(--warn)">⚠ ${idle(r)} ngày chưa cập nhật</span>`:''}${r.status==='lost'&&r.lost_reason?`<span class="m">Lý do: ${esc(r.lost_reason)}</span>`:''}</div>`).join('')}${list.length>40?`<div class="small muted">+${list.length-40}</div>`:''}</div>`}).join('')};

    $('#impB').onclick=async()=>{const r=await api('/leads/import',{method:'POST',body:{text:$('#impT').value}});closeModal();toast('Đã nhập '+r.created+' khách');loadPage()}};
}
function leadForm(l){const mb=$('#modalBody');const f=(id,label,val,type='text',extra='')=>`<label>${label}<br><input class="f" id="${id}" type="${type}" value="${esc(val??'')}" style="width:100%" ${extra}></label>`;

  ${f('lValue','Giá trị dự kiến (đ)',l.value||'','number')}${f('lProd','Quan tâm sản phẩm',l.product_interest)}${f('lAddr','Địa chỉ',l.address)}
  <label>Trạng thái<br><select class="f" id="lStatus" style="width:100%">${LSTAT.map(([k,v])=>`<option value="${k}" ${k===(l.status||'new')?'selected':''}>${v}</option>`).join('')}</select></label>
  ${f('lNext','Việc tiếp theo',l.next_action)}${f('lNextD','Ngày hẹn',l.next_date,'date')}${f('lLost','Lý do thất bại (nếu có)',l.lost_reason,'text','list="lostList"')}<datalist id="lostList">${LOST.map(x=>`<option>${x}</option>`).join('')}</datalist></div>

async function setLeadStatus(id,s){let reason=null;let value=null;if(s==='lost'){reason=prompt('Lý do thất bại — gõ một trong các lý do sau để thống kê được:\n'+LOST.join(' · '),'');if(reason===null)return}

  const nk=$('#cNoKpi');if(nk&&!nk.disabled)nk.onchange=async()=>{await api('/boss',{method:'POST',body:{id:id,no_kpi:nk.checked}});toast('Đã cập nhật')};
  const a=$('#asg');if(a)a.onchange=async()=>{await api(`/customers/${id}/sale`,{method:'POST',body:{sale:a.value}});toast('Đã gán sale');state.sales=await api('/sales')};
  chart('cm',{type:'bar',data:{labels:d.monthly.map(x=>x.ym.slice(5)+'/'+x.ym.slice(2,4)),datasets:[{data:d.monthly.map(x=>x.rev),backgroundColor:css('--s1'),borderRadius:4,borderSkipped:'bottom'}]},options:Object.assign(gridOpt(),{plugins:{tooltip:{callbacks:{label:c=>' '+fmt(c.raw)+' đ · '+d.monthly[c.dataIndex].n+' HĐ'}}}})});
}
function closeModal(){$('#modal').classList.remove('open');$('#modalBody').style.width='';$('#modalBody').classList.remove('cmdbox');const o=state._opener;state._opener=null;if(o&&o.isConnected)o.focus()}
// Tìm nhanh kiểu Attio: Ctrl/⌘ + K mở ô tìm trang và khách hàng
function cmdOpen(){if(!state.user)return;state.cmdQ='';state.cmdCust=[];state.cmdSel=0;
  evModal(`<div class="cmdin">${ic('search')}<input id="cmdQ" placeholder="Tìm trang hoặc khách hàng (tên, SĐT, mã KH)…" autocomplete="off" spellcheck="false" aria-label="Tìm nhanh" aria-controls="cmdList"><kbd>Esc</kbd></div><div id="cmdList" role="listbox" aria-label="Kết quả"></div>`);
  $('#modalBody').classList.add('cmdbox');cmdRender();let tm;
  $('#cmdQ').oninput=e=>{state.cmdQ=e.target.value;state.cmdSel=0;if(state.cmdQ.trim().length<2)state.cmdCust=[];cmdRender();clearTimeout(tm);
    if(state.cmdQ.trim().length>=2)tm=setTimeout(async()=>{const q=state.cmdQ;try{const r=await api('/customers/search?q='+encodeURIComponent(q.trim()));if(q===state.cmdQ){state.cmdCust=r.slice(0,8);cmdRender()}}catch(_){}},250)};
  $('#cmdQ').onkeydown=e=>{const it=[...document.querySelectorAll('.cmdit')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();state.cmdSel=Math.max(0,Math.min(it.length-1,state.cmdSel+(e.key==='ArrowDown'?1:-1)));cmdMark()}
    else if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(it[state.cmdSel])it[state.cmdSel].click()}}}
function cmdRender(){const n=evNoAcc(state.cmdQ),P=PAGES.filter(p=>canPage(p[0])&&(!n||evNoAcc(p[1]).includes(n))),C=state.cmdCust||[];
  $('#cmdList').innerHTML=(P.length?'<div class="cmdsec">Trang</div>'+P.map(p=>`<button class="cmdit" role="option" onclick="closeModal();location.hash='#${p[0]}'">${pgIco(p[0])}${p[1]}</button>`).join(''):'')
   +(C.length?'<div class="cmdsec">Khách hàng</div>'+C.map(c=>`<button class="cmdit" role="option" onclick="closeModal();openCustomer(${c.id})">${pgIco('customers')}<span>${esc(c.name)}</span><span class="small muted">${esc([c.code,c.contact_number,c.sale].filter(Boolean).join(' · '))}</span></button>`).join(''):'')
   ||`<div class="cmdempty">${state.cmdQ.trim().length>=2?'Không tìm thấy trang hay khách nào':'Gõ tên trang, hoặc từ 2 ký tự tên / SĐT / mã khách'}</div>`;cmdMark()}
function cmdMark(){document.querySelectorAll('.cmdit').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===state.cmdSel));if(i===state.cmdSel)b.scrollIntoView({block:'nearest'})})}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'&&state.user){e.preventDefault();cmdOpen()}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#modal').classList.contains('open'))closeModal();else if($('#nav.open'))navSet(false)});
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};

// Sort table by clicking header (simple, client side)
function sortable(sel,redraw){const t=$(sel);if(!t)return;t.querySelectorAll('th').forEach((th,i)=>{th.onclick=()=>{const tb=t.tBodies[0];const rows=[...tb.rows];const asc=th.dataset.asc!=='1';th.dataset.asc=asc?'1':'0';
  const val=r=>{const x=r.cells[i].textContent.replace(/[^\d.,\-−]/g,'').replace('−','-').replace(/\./g,'').replace(',','.');return x!==''&&!isNaN(+x)?+x:r.cells[i].textContent.toLowerCase()};
  rows.sort((a,b)=>{const A=val(a),B=val(b);return (A>B?1:A<B?-1:0)*(asc?1:-1)});rows.forEach(r=>tb.appendChild(r))}})}

// Theme + boot
api('/me').then(u=>{state.user=u;boot()}).catch(()=>render());
api('/status').then(s=>state.churn=s.churn_days).catch(()=>{});
</script>
