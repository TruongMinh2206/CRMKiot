<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM KiotViet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231f6f43'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>C</text></svg>">
<script src="/static/chart.umd.js"></script>
<style>
:root{
  --bg:#f4f5f3;--surface:#ffffff;--surface-2:#f7f8f6;--border:#e3e5e0;--text:#151715;--text-2:#555a55;--muted:#8a8f89;
  --brand:#1f6f43;--brand-2:#e8f3ec;--good:#008300;--warn:#c98500;--bad:#d1352b;--bad-2:#fdecea;--good-2:#e8f5e8;--warn-2:#fff4dd;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141514;--surface:#1d1f1d;--surface-2:#242724;--border:#2f332f;--text:#eeefec;--text-2:#b9bdb8;--muted:#7e837e;
  --brand:#3ca96a;--brand-2:#1e3328;--good:#4cbd4c;--bad:#e66767;--bad-2:#3a2422;--good-2:#1f3320;--warn:#e0a53a;--warn-2:#3a3120;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;}}
:root[data-theme="dark"]{
  --bg:#141514;--surface:#1d1f1d;--surface-2:#242724;--border:#2f332f;--text:#eeefec;--text-2:#b9bdb8;--muted:#7e837e;
  --brand:#3ca96a;--brand-2:#1e3328;--good:#4cbd4c;--bad:#e66767;--bad-2:#3a2422;--good-2:#1f3320;--warn:#e0a53a;--warn-2:#3a3120;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 8px 16px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
nav a.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500}
nav a.item:hover{background:var(--surface-2)}
nav a.item.active{background:var(--brand-2);color:var(--brand);font-weight:600}
nav .spacer{flex:1}
nav .user{font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--border)}
main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.topbar h1{font-size:20px;margin:0;flex:1;min-width:200px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.small{padding:4px 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}nav .spacer,nav .user{display:none}main{padding:16px}.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.card h3 .x{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.tile .d{font-size:12px;color:var(--muted)}
.delta{font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px}
.delta.up{background:var(--good-2);color:var(--good)} .delta.down{background:var(--bad-2);color:var(--bad)} .delta.flat{background:var(--surface-2);color:var(--muted)}
.chart{position:relative;height:260px} .chart.tall{height:340px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;white-space:nowrap}
th{font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);position:sticky;top:0;cursor:pointer;user-select:none}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--surface-2)}
td.name{white-space:normal;min-width:160px}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--text-2)}
.tag.good{background:var(--good-2);color:var(--good)} .tag.bad{background:var(--bad-2);color:var(--bad)} .tag.warn{background:var(--warn-2);color:var(--warn)} .tag.info{background:var(--brand-2);color:var(--brand)}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center}
.login .card{width:360px}
.login input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);margin:6px 0 12px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal.open{display:flex}
.modal .card{width:min(960px,100%)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px} .kv b{color:var(--text-2);font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.bar i{display:block;height:100%;background:var(--s1);border-radius:4px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.sync{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}.dot.busy{background:var(--warn);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.funnel{display:flex;gap:8px;align-items:stretch}
.funnel div{flex:1;padding:12px;border-radius:10px;background:var(--surface-2);text-align:center}
.funnel b{display:block;font-size:22px}
input.f,select.f,textarea.f{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
@media (max-width:1100px){.kanban{grid-template-columns:1fr 1fr}}
.col{background:var(--surface-2);border-radius:10px;padding:8px;min-height:120px}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:13px}
.lead:hover{box-shadow:var(--shadow)}
.lead b{display:block}.lead .m{display:block;color:var(--muted);font-size:12px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px}
.task .t{flex:1;min-width:0}.task .t b{display:block}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:80px}.prog i{display:block;height:100%;background:var(--s3)}
.prog i.low{background:var(--s8)}.prog i.mid{background:var(--s4)}
textarea{width:100%;min-height:60px;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface-2)}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>

<script>
// ============================================================================
// Helpers
// ============================================================================
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'–':Math.round(n).toLocaleString('vi-VN');
const fmtK=n=>{if(n==null)return '–';const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(2)+' tỷ';if(a>=1e6)return (n/1e6).toFixed(1)+' tr';if(a>=1e3)return (n/1e3).toFixed(0)+' k';return fmt(n)};
const pct=n=>n==null?'–':(n>0?'+':'')+n.toFixed(1)+'%';
const d10=s=>s?s.slice(0,10):'';
const dmy=s=>{if(!s)return '';const [y,m,d]=s.slice(0,10).split('-');return `${d}/${m}/${y}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const delta=(v)=>v==null?'<span class="delta flat">–</span>':`<span class="delta ${v>0?'up':v<0?'down':'flat'}">${pct(v)}</span>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S=()=>['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'].map(css);
async function api(path,opt={}){
  const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){state.user=null;render();throw new Error('401')}
  if(!r.ok){let m='Lỗi';try{m=(await r.json()).detail||m}catch{}toast(m);throw new Error(m)}
  return r.json();
}
const today=new Date();const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const state={user:null,page:'overview',from:iso(new Date(today.getFullYear(),today.getMonth(),1)),to:iso(today),sale:'',sales:[],charts:{}};
Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
Chart.defaults.color=css('--text-2');Chart.defaults.borderColor=css('--border');
function chart(id,cfg){if(cfg.options&&cfg.options.indexAxis==='y'){cfg.options.scales.y.ticks=Object.assign({callback:function(v){const l=this.getLabelForValue(v);return l.length>28?l.slice(0,27)+'…':l}},cfg.options.scales.y.ticks||{})}if(state.charts[id])state.charts[id].destroy();const el=document.getElementById(id);if(!el)return;
  cfg.options=cfg.options||{};cfg.options.maintainAspectRatio=false;cfg.options.responsive=true;
  cfg.options.plugins=Object.assign({legend:{display:false}},cfg.options.plugins||{});
  cfg.options.interaction=cfg.options.interaction||{mode:'index',intersect:false};
  state.charts[id]=new Chart(el,cfg)}
const gridOpt=(money=true,horiz=false)=>horiz?{indexAxis:'y',scales:{y:{grid:{display:false}},x:{beginAtZero:true,grid:{color:css('--border')},ticks:{callback:v=>money?fmtK(v):v}}}}:{scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:css('--border')},ticks:{callback:v=>money?fmtK(v):v}}}};

// ============================================================================
// Shell
// ============================================================================
const PAGES=[['overview','Tổng quan','◫'],['board','Bảng doanh số','▦'],['tasks','Công việc','☑'],['kpi','KPI sale','🎯'],['leads','Khách tiềm năng','🧲'],['sales','Khách theo sale','👥'],['trend','Biến động KH','📈'],['customers','Doanh số KH','💰'],['products','Hàng nhanh / chậm','📦'],['journey','Hành trình đơn','🚚'],['birthdays','Sinh nhật KH','🎂'],['settings','Cài đặt','⚙']];
function render(){
  const root=$('#root');
  if(!state.user){root.innerHTML=`<div class="login"><div class="card"><div class="logo"><span class="mark">C</span>CRM KiotViet</div>
    <label>Tên đăng nhập<input id="u" autocomplete="username"></label><label>Mật khẩu<input id="p" type="password" autocomplete="current-password"></label>
    <div class="err" id="lerr"></div><button class="btn primary" style="width:100%" id="lbtn">Đăng nhập</button></div></div>`;
    const go=async()=>{try{state.user=await api('/login',{method:'POST',body:{username:$('#u').value,password:$('#p').value}});boot()}catch(e){$('#lerr').textContent='Sai tài khoản hoặc mật khẩu'}};
    $('#lbtn').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()};$('#u').onkeydown=e=>{if(e.key==='Enter')$('#p').focus()};$('#u').focus();return}
  const pages=PAGES.filter(p=>p[0]!=='settings'||state.user.role==='admin');
  root.innerHTML=`<div class="app"><nav><div class="logo"><span class="mark">C</span>CRM KiotViet</div>
    ${pages.map(p=>`<a class="item ${state.page===p[0]?'active':''}" href="#${p[0]}"><span>${p[2]}</span>${p[1]}</a>`).join('')}
    <div class="spacer"></div><div class="sync" id="syncbar"></div>
    <div class="user">${esc(state.user.display_name)} · ${state.user.role==='admin'?'Quản trị':state.user.role==='accountant'?'Kế toán':'Sale'}<br><a href="#" id="logout">Đăng xuất</a></div></nav>
    <main id="main"></main></div>`;
  $('#logout').onclick=async e=>{e.preventDefault();await api('/logout',{method:'POST'});state.user=null;render()};
  loadPage();refreshSync();
}
function topbar(title,{dates=true,sale=true,extra='',exportKey=null}={}){
  const saleSel=sale&&state.user.role!=='sale'?`<select id="fSale"><option value="">Tất cả sale</option>${state.sales.map(s=>`<option ${s===state.sale?'selected':''}>${esc(s)}</option>`).join('')}</select>`:'';
  const dateIn=dates?`<div class="chips" id="quick">${['Tháng này','Tháng trước','7 ngày','30 ngày','Quý này','Năm nay'].map(q=>`<span class="chip">${q}</span>`).join('')}</div>
    <input type="date" id="fFrom" value="${state.from}"> <span class="muted">→</span> <input type="date" id="fTo" value="${state.to}">`:'';
  return `<div class="topbar"><h1>${title}</h1><div class="filters">${dateIn}${saleSel}${extra}${exportKey?`<button class="btn" id="btnExport">⬇ Excel</button>`:''}</div></div>`;
}
function bindTopbar(exportKey){
  const re=()=>{const f=$('#fFrom'),t=$('#fTo');if(f)state.from=f.value;if(t)state.to=t.value;const s=$('#fSale');if(s)state.sale=s.value;loadPage()};
  ['#fFrom','#fTo','#fSale'].forEach(x=>{const el=$(x);if(el)el.onchange=re});
  document.querySelectorAll('#quick .chip').forEach(c=>c.onclick=()=>{const t=new Date();let f,e=t;
    switch(c.textContent){case 'Tháng này':f=new Date(t.getFullYear(),t.getMonth(),1);break;case 'Tháng trước':f=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0);break;
      case '7 ngày':f=new Date(t-6*864e5);break;case '30 ngày':f=new Date(t-29*864e5);break;case 'Quý này':f=new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1);break;case 'Năm nay':f=new Date(t.getFullYear(),0,1)}
    state.from=iso(f);state.to=iso(e);loadPage()});
  if(exportKey&&$('#btnExport'))$('#btnExport').onclick=()=>{window.location=`/api/export/${exportKey}?${qs()}`};
}
const qs=(o={})=>new URLSearchParams(Object.assign({from:state.from,to:state.to,sale:state.sale},o)).toString();
async function refreshSync(){try{const s=await api('/status');const el=$('#syncbar');if(!el)return;
  const busy=s.sync.running||s.sync.reapplying;
  if(state._busy&&!busy){state._busy=false;try{state.sales=await api('/sales')}catch{};loadPage()}
  state._busy=busy;
  el.innerHTML=`<span class="dot ${busy?'busy':''}"></span>${busy?esc(s.sync.progress||'Đang xử lý'):'Đồng bộ: '+(s.last_sync?dmy(s.last_sync)+' '+s.last_sync.slice(11,16):'chưa')}`;
  if(busy)setTimeout(refreshSync,3000)}catch{}}
window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'overview';render()});
async function boot(){state.page=location.hash.slice(1)||'overview';try{state.sales=await api('/sales')}catch{}render()}

// ============================================================================
// Pages
// ============================================================================
async function loadPage(){const m=$('#main');if(!m)return;m.innerHTML='<div class="empty">Đang tải…</div>';
  try{await ({overview,sales,trend,customers,products,journey,birthdays,settings,tasks,kpi,leads,board}[state.page]||overview)()}catch(e){console.error(e);if(e.message!=='401')m.innerHTML=`<div class="empty">Không tải được: ${esc(e.message)}</div>`}}

async function overview(){
  const d=await api('/overview?'+qs());const s=d.summary;const m=$('#main');
  m.innerHTML=topbar('Tổng quan')+`<div class="grid g4 g5">
    <div class="card tile"><h3>Doanh số</h3><div class="v">${fmtK(s.revenue)}</div><div class="d">${delta(s.revenue_growth)} so kỳ trước (${fmtK(s.revenue_prev)})</div></div>
    <div class="card tile"><h3>Hoá đơn</h3><div class="v">${fmt(s.invoices)}</div><div class="d">${delta(s.invoices_prev?(s.invoices-s.invoices_prev)/s.invoices_prev*100:null)} · TB ${fmtK(s.invoices?s.revenue/s.invoices:0)}/HĐ</div></div>
    <div class="card tile"><h3>Khách có mua</h3><div class="v">${fmt(s.customers)}</div><div class="d">${delta(s.customers_prev?(s.customers-s.customers_prev)/s.customers_prev*100:null)} · tổng ${fmt(s.total_customers)} KH</div></div>
    <div class="card tile"><h3>Việc hôm nay <span class="x"><a href="#tasks">mở</a></span></h3><div class="v">${d.tasks_today??0}</div><div class="d">${d.tasks_overdue?`<span style="color:var(--bad)">${d.tasks_overdue} quá hạn</span>`:'không có việc quá hạn'}</div></div>
    <div class="card tile"><h3>Khách mới</h3><div class="v">${fmt(s.new_customers)}</div><div class="d">${delta(s.new_customers_prev?(s.new_customers-s.new_customers_prev)/s.new_customers_prev*100:null)} so kỳ trước (${fmt(s.new_customers_prev)})</div></div>
  </div><div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Doanh số theo ngày</h3><div class="chart"><canvas id="cDaily"></canvas></div></div>
    <div class="card"><h3>Sinh nhật 7 ngày tới <span class="x"><a href="#birthdays">xem tất cả</a></span></h3>
      ${d.birthdays.length?`<div class="tablewrap" style="max-height:300px"><table><tr><th>Ngày</th><th>Khách</th><th>SĐT</th><th>Sale</th></tr>${d.birthdays.map(b=>`<tr><td>${b.birthday_ddmm} ${b.days_until===0?'<span class="tag good">hôm nay</span>':b.days_until===1?'<span class="tag warn">mai</span>':''}</td><td class="name"><a href="#" onclick="openCustomer(${b.id});return false">${esc(b.name)}</a></td><td>${esc((b.contact_number||'').slice(0,12))}</td><td>${esc(b.sale)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Không có sinh nhật trong 7 ngày tới</div>'}</div>
  </div><div class="card" style="margin-top:14px"><h3>Top 12 sale theo doanh số <span class="x"><a href="#sales">chi tiết</a></span></h3><div class="chart tall"><canvas id="cSale"></canvas></div></div>`;
  bindTopbar();

async function board(){
  const m=$('#main');const basis=state.basis||'';const wk=state.weekly?'&weekly=1':'';
  const d=await api(`/board?from=${state.from}&to=${state.to}${wk}`+(basis?'&basis='+basis:''));
  state.basis=d.basis;
  const C=d.cats;const money=v=>v?fmt(v):'–';
  const st=v=>v==null?'':`<span class="tag ${v==='ĐẠT'?'good':'bad'}">${v}</span>`;
  const col=p=>p==null?'var(--muted)':p>=100?'var(--good)':p>=80?'var(--warn)':'var(--bad)';
  const pctCell=p=>p==null?'<span class="muted">–</span>':`<b style="color:${col(p)}">${p}%</b>`;
  const cell=(v,p)=>`<td class="r">${money(v)}${p!=null?`<br><span class="small" style="color:${col(p)}">${p}%</span>`:''}</td>`;
  const byTeam={};d.rows.forEach(r=>(byTeam[r.team]=byTeam[r.team]||[]).push(r));
  const W=d.weeks||[];
  const head=`<tr><th>Team / Sale</th><th class="r">Mục tiêu</th><th class="r">DS khách sale</th>${C.map(c=>`<th class="r">${c[1]}<br><span class="small muted">${d.alloc[c[0]]||0}%</span></th>`).join('')}<th class="r">Bán cho KH mới<br><span class="small muted">${d.alloc.new_customer||0}%</span></th><th class="r">DS khách sếp</th>${W.map(w=>`<th class="r">Tuần ${w.week}</th>`).join('')}<th class="r">Hàng trả</th><th class="r">HĐ huỷ</th><th class="r">TỔNG</th><th class="r">% KPI</th><th>Tình trạng</th></tr>`;
  const line=(r,isTeam)=>`<tr ${isTeam?'style="background:var(--brand-2);font-weight:600"':''}><td ${isTeam?'':'style="padding-left:22px"'}>${isTeam?'TỔNG TEAM '+esc(r.team).toUpperCase():esc(r.sale)}</td>
    <td class="r ${isTeam?'':'muted'}">${money(r.target)}</td><td class="r">${money(r.rev_sale)}</td>
    ${C.map(c=>cell(r[c[0]],r[c[0]+'_pct'])).join('')}${cell(r.new_customer_rev,r.new_customer_pct)}
    <td class="r">${money(r.rev_boss)}</td>${(r.weeks||[]).map(v=>`<td class="r">${money(v)}</td>`).join('')}
    <td class="r" style="color:${r.returns?'var(--bad)':'var(--muted)'}">${r.returns?'−'+fmt(r.returns):'–'}</td>
    <td class="r" title="Hoá đơn đã huỷ trên KiotViet — không tính vào doanh số">${r.cancelled?`<span class="muted">${fmt(r.cancelled)}</span><br><span class="small muted">${r.cancelled_n} HĐ</span>`:'<span class="muted">–</span>'}</td>
    <td class="r"><b>${money(r.total)}</b></td><td class="r">${pctCell(r.pct)}</td><td>${st(r.status)}</td></tr>`;
  const body=d.teams.map(g=>line(g,true)+(byTeam[g.team]||[]).map(r=>line(r,false)).join('')).join('');
  const T=k=>d.rows.reduce((a,r)=>a+(r[k]||0),0);
  m.innerHTML=topbar('Bảng doanh số',{sale:false,extra:`<select class="f" id="fBasis"><option value="accounting" ${d.basis==='accounting'?'selected':''}>Như kế toán đang tính (khuyến nghị)</option><option value="customer" ${d.basis==='customer'?'selected':''}>Tất cả theo sale phụ trách khách</option><option value="invoice" ${d.basis==='invoice'?'selected':''}>Tất cả theo người bán trên hoá đơn</option></select><label class="small" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="fWeek" ${state.weekly?'checked':''}> theo tuần</label><label class="small" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="gRepB"> ghi đè</label><button class="btn" id="bGsB" title="Xuất sang Google Sheet đúng khoảng ngày đang chọn ở trên">⬇ Google Sheet</button>`})+
  `<div class="grid g4"><div class="card tile"><h3>Doanh số thực</h3><div class="v">${fmtK(T('total'))}</div><div class="d">bán ${fmtK(T('gross'))} − trả ${fmtK(T('returns'))}</div></div>
   <div class="card tile"><h3>Mục tiêu</h3><div class="v">${fmtK(T('target'))}</div><div class="d">${T('target')?'đạt '+Math.round(T('total')/T('target')*100)+'%':'chưa đặt chỉ tiêu'} · <a href="#kpi">đặt</a></div></div>
   <div class="card tile"><h3>Độc quyền (mới + cũ)</h3><div class="v">${fmtK(T('excl_new')+T('excl_old'))}</div><div class="d">mới ${fmtK(T('excl_new'))} · cũ ${fmtK(T('excl_old'))}</div></div>
   <div class="card tile"><h3>Khách sếp</h3><div class="v">${fmtK(T('rev_boss'))}</div><div class="d">khách sale ${fmtK(T('rev_sale'))}</div></div></div>
  <div class="card" style="margin-top:14px"><h3>Bảng doanh số ${dmy(d.from)} – ${dmy(d.to)} <span class="x">${d.basis==='accounting'?'khách sale theo người bán trên HĐ · khách sếp theo sale phụ trách':d.basis==='invoice'?'tính theo người bán ghi trên hoá đơn':'tính theo sale phụ trách khách (đuôi tên)'} · khách sếp đã trừ hàng trả, khách sale tính gộp</span></h3>
   <div class="tablewrap"><table id="t"><thead>${head}</thead><tbody>${body||'<tr><td colspan="16" class="empty">Chưa có dữ liệu</td></tr>'}</tbody></table></div>
   <p class="small muted">Nút <b>Google Sheet</b> xuất đúng khoảng ngày đang chọn ở trên. Cột tuần cắt theo chủ nhật giống bảng kế toán, và nhãn tuần được ghi thẳng vào sheet nên luôn biết mỗi cột gồm những ngày nào; chọn khoảng ngắn thì cột tuần thừa để trống.</p>
   <p class="small muted">Cột <b>HĐ huỷ</b> là hoá đơn đã huỷ trên KiotViet trong kỳ — CRM không tính vào doanh số. Nếu bảng kế toán gõ tay cao hơn CRM, hãy đối chiếu cột này trước: hoá đơn bị huỷ sau khi họ điền số là nguyên nhân thường gặp nhất.</p>
   <p class="small muted">% dưới mỗi nhóm hàng là mức đạt so với phần chỉ tiêu phân bổ cho nhóm đó (sửa tỷ lệ trong Cài đặt). Cột nhóm hàng và "bán cho khách mới" tính trên phần khách sale; "khách mới" theo dõi riêng, không cộng vào tổng.</p></div>`;
  const cl=d.cancelled_list||[];
  if(cl.length) m.insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:14px"><h3>Hoá đơn đã huỷ trong kỳ <span class="x">${cl.length} hoá đơn · ${fmtK(cl.reduce((a,r)=>a+r.total,0))}</span></h3>
    <p class="small muted">Những hoá đơn này đã bị huỷ trên KiotViet nên CRM không tính vào doanh số. Dùng danh sách này để đối chiếu khi bảng gõ tay lệch so với CRM.</p>
    <div class="tablewrap" style="max-height:340px"><table><thead><tr><th>Mã HĐ</th><th>Ngày</th><th>Khách hàng</th><th>Người bán</th><th>Nhóm</th><th class="r">Giá trị</th></tr></thead><tbody>
    ${cl.map(r=>`<tr><td>${esc(r.code)}</td><td>${dmy(r.d)}</td><td>${esc(r.customer)}</td><td>${esc(r.sale||'')}</td><td>${r.is_boss?'<span class="tag">Khách sếp</span>':'Khách sale'}</td><td class="r">${fmt(r.total)}</td></tr>`).join('')}
    </tbody></table></div></div>`);
  bindTopbar(null);
  $('#bGsB').onclick=async()=>{const bt=$('#bGsB');const old=bt.textContent;bt.disabled=true;bt.textContent='Đang xuất…';
    try{const r=await api('/gsheet/export',{method:'POST',body:{from:state.from,to:state.to,replace:$('#gRepB').checked}});
      toast('Đã xuất tab '+r.title);window.open(r.url,'_blank')}
    catch(e){toast(String(e.message||e))}
    finally{bt.disabled=false;bt.textContent=old}};
  $('#fBasis').onchange=async e=>{state.basis=e.target.value;await api('/teams',{method:'POST',body:{basis:e.target.value}});loadPage()};
  $('#fWeek').onchange=e=>{state.weekly=e.target.checked;loadPage()};
}

async function tasks(){

  const today=iso(new Date());const od=open.filter(t=>t.overdue),td=open.filter(t=>t.today),up=open.filter(t=>!t.overdue&&!t.today);
  const TT={call:'Gọi điện',visit:'Ghé thăm',message:'Nhắn tin',birthday:'Chúc sinh nhật',reorder:'Nhắc mua lại',winback:'Kéo lại KH',other:'Khác'};
  const row=t=>`<div class="task"><input type="checkbox" onchange="doneTask(${t.id})" title="Hoàn thành"><div class="t"><b>${esc(t.title)} <span class="tag ${t.overdue?'bad':t.today?'warn':''}">${t.overdue?'quá hạn ':''}${dmy(t.due_date)}</span> <span class="tag">${TT[t.type]||t.type}</span></b>
    <span class="small muted">${t.customer_name?`<a href="#" onclick="openCustomer(${t.customer_id});return false">${esc(t.customer_name)}</a> · ${esc(t.contact_number||'')}`:t.lead_name?`🧲 <a href="#" onclick="openLead(${t.lead_id});return false">${esc(t.lead_name)}</a> · ${esc(t.lead_phone||'')}`:''} ${t.assigned_to?'· '+esc(t.assigned_to):''}</span></div>
    <button class="btn small" onclick="cancelTask(${t.id})">Bỏ</button></div>`;
  const sugNew=sug.filter(x=>!x.exists);const kinds={birthday:'🎂 Sinh nhật',reorder:'🔁 Đến kỳ mua lại',winback:'🔥 Khách giá trị đang ngừng mua'};
  m.innerHTML=topbar('Công việc & nhắc việc',{dates:false})+`<div class="grid g4">
    <div class="card tile"><h3>Quá hạn</h3><div class="v" style="color:var(--bad)">${od.length}</div></div><div class="card tile"><h3>Hôm nay</h3><div class="v" style="color:var(--warn)">${td.length}</div></div>
    <div class="card tile"><h3>Sắp tới</h3><div class="v">${up.length}</div></div><div class="card tile"><h3>Gợi ý chưa tạo</h3><div class="v" style="color:var(--brand)">${sugNew.length}</div><div class="d">từ sinh nhật, chu kỳ mua, ngừng mua</div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Việc cần làm <span class="x"><a href="#" onclick="newTask();return false">+ Thêm việc</a> · <a href="#" onclick="state.taskHist=1;loadPage();return false">đã xong</a></span></h3>
    ${od.length?'<h4 style="margin:8px 0 0;color:var(--bad)">Quá hạn</h4>'+od.map(row).join(''):''}${td.length?'<h4 style="margin:8px 0 0;color:var(--warn)">Hôm nay</h4>'+td.map(row).join(''):''}${up.length?'<h4 style="margin:8px 0 0">Sắp tới</h4>'+up.map(row).join(''):''}${open.length?'':'<div class="empty">Không có việc nào. Lấy gợi ý bên phải hoặc bấm + Thêm việc.</div>'}</div>
    <div class="card"><h3>Gợi ý tự động <span class="x">${sugNew.length?`<a href="#" onclick="addSug('all');return false">Tạo tất cả (${sugNew.length})</a>`:''}</span></h3>
    ${Object.keys(kinds).map(k=>{const l=sugNew.filter(x=>x.kind===k);if(!l.length)return '';return `<h4 style="margin:10px 0 4px">${kinds[k]} (${l.length}) <a href="#" class="small" onclick="addSug('${k}');return false">tạo nhóm này</a></h4>`+l.slice(0,15).map(x=>`<div class="task"><button class="btn small" onclick="addSug(${JSON.stringify(x.auto_key)})">+ Tạo</button><div class="t"><b><a href="#" onclick="openCustomer(${x.customer_id});return false">${esc(x.customer_name)}</a> <span class="muted small">${esc(x.phone||'')}</span></b><span class="small muted">${esc(x.reason)} · ${esc(x.sale)}</span></div></div>`).join('')+(l.length>15?`<div class="small muted">… và ${l.length-15} khách nữa</div>`:'')}).join('')||'<div class="empty">Không có gợi ý mới</div>'}</div></div>`;
  bindTopbar();window._sug=sug;
  if(state.taskHist){state.taskHist=0;const hist=await api('/tasks?status=done&sale='+encodeURIComponent(sale));m.insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:14px"><h3>Đã xong / đã bỏ (300 gần nhất)</h3><div class="tablewrap"><table><thead><tr><th>Việc</th><th>Khách</th><th>Sale</th><th>Hạn</th><th>Xong lúc</th><th>Kết quả</th><th>TT</th></tr></thead><tbody>${hist.map(t=>`<tr><td class="name">${esc(t.title)}</td><td>${esc(t.customer_name||t.lead_name||'')}</td><td>${esc(t.assigned_to||'')}</td><td>${dmy(t.due_date)}</td><td>${(t.done_at||'').replace('T',' ')}</td><td class="name">${esc(t.result||'')}</td><td><span class="tag ${t.status==='done'?'good':''}">${t.status==='done'?'Xong':'Bỏ'}</span></td></tr>`).join('')}</tbody></table></div></div>`)}
}
async function doneTask(id){const r=prompt('Kết quả (gọi được/không nghe máy/đã đặt hàng...):','');if(r===null){loadPage();return}await api('/tasks',{method:'POST',body:{id,status:'done',result:r}});toast('Đã hoàn thành');loadPage()}

async function addSug(k){const items=(window._sug||[]).filter(x=>!x.exists&&(k==='all'||x.kind===k||x.auto_key===k)).map(x=>({customer_id:x.customer_id,title:x.title,type:x.type,due_date:x.due_date,assigned_to:x.sale==='(Chưa gán)'?'':x.sale,auto_key:x.auto_key,priority:x.priority}));

async function kpi(){
  const ym=state.kpiYm||iso(new Date()).slice(0,7);const d=await api('/kpi?ym='+ym);const m=$('#main');const mgr=state.user.role!=='sale';
  const bar=(p)=>p==null?'<span class="muted small">chưa đặt</span>':`<div class="row" style="gap:6px"><div class="prog" style="flex:1"><i class="${p<60?'low':p<90?'mid':''}" style="width:${Math.min(100,p)}%"></i></div><b style="width:52px;text-align:right">${p}%</b></div>`;
  const tot=k=>d.rows.reduce((a,r)=>a+(r[k]||0),0);const totPct=tot('revenue_target')?Math.round(tot('revenue')/tot('revenue_target')*100):null;

  $('#fYm').onchange=e=>{state.kpiYm=e.target.value;loadPage()};sortable('#t');
  if(mgr){$('#bCopy').onclick=async()=>{const p=new Date(ym+'-01');p.setMonth(p.getMonth()-1);await api('/kpi/copy',{method:'POST',body:{from:iso(p).slice(0,7),to:ym}});toast('Đã chép');loadPage()};
    $('#bEdit').onclick=()=>{const mb=$('#modalBody');const names=[...new Set([...d.rows.map(r=>r.sale),...state.sales])].filter(x=>x!=='(Chưa gán)').sort();
      mb.innerHTML=`<div class="row"><h2 style="margin:0;flex:1">Chỉ tiêu tháng ${ym.slice(5)}/${ym.slice(0,4)}</h2><button class="btn" onclick="closeModal()">✕</button></div><p class="small muted">Doanh số nhập theo triệu đồng. Để trống = không đặt.</p>
      <div class="tablewrap" style="max-height:60vh"><table><thead><tr><th>Sale</th><th>Doanh số (tr)</th><th>KH mới</th><th>KH có mua</th></tr></thead><tbody>${names.map(n=>{const r=d.rows.find(x=>x.sale===n)||{};return `<tr data-s="${esc(n)}"><td>${esc(n)}</td><td><input class="f k1" type="number" value="${r.revenue_target?Math.round(r.revenue_target/1e6):''}" style="width:110px"></td><td><input class="f k2" type="number" value="${r.new_customers_target||''}" style="width:80px"></td><td><input class="f k3" type="number" value="${r.buying_customers_target||''}" style="width:80px"></td></tr>`}).join('')}</tbody></table></div>

const LSTAT=[['new','Mới'],['contacted','Đã liên hệ'],['consulting','Đang tư vấn'],['won','Đã chốt'],['lost','Thất bại']];
async function leads(){
  const m=$('#main');const sale=state.user.role==='sale'?'':state.sale;
  const [rows,st]=await Promise.all([api('/leads?sale='+encodeURIComponent(sale)),api('/leads/stats?sale='+encodeURIComponent(sale))]);
  const F=st.funnel||{};const won=F.won||0,closed=won+(F.lost||0);
  m.innerHTML=topbar('Khách tiềm năng',{dates:false,extra:`<input class="f" id="fQ" placeholder="Tìm tên / SĐT"><button class="btn primary" id="bNew">+ Thêm khách</button><button class="btn" id="bImp">Dán từ Excel</button>`})+
  `<div class="grid g4"><div class="card tile"><h3>Đang theo dõi</h3><div class="v">${rows.filter(r=>!['won','lost'].includes(r.status)).length}</div><div class="d">mới + đã liên hệ + đang tư vấn</div></div>
   <div class="card tile"><h3>Đã chốt (90 ngày)</h3><div class="v" style="color:var(--good)">${won}</div><div class="d">giá trị ${fmtK(st.by_sale.reduce((a,r)=>a+r.won_value,0))}</div></div>
   <div class="card tile"><h3>Tỷ lệ chốt</h3><div class="v">${closed?Math.round(won/closed*100)+'%':'–'}</div><div class="d">trên số đã kết thúc (${closed})</div></div>
   <div class="card tile"><h3>Thất bại</h3><div class="v" style="color:var(--bad)">${F.lost||0}</div><div class="d">${(st.lost_reasons[0]||{}).k?'lý do nhiều nhất: '+esc(st.lost_reasons[0].k):''}</div></div></div>
  <div class="card" style="margin-top:14px"><h3>Phễu <span class="x">bấm thẻ để mở; đổi trạng thái trong thẻ</span></h3><div class="kanban" id="kb"></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Theo sale (90 ngày)</h3><table><thead><tr><th>Sale</th><th class="r">Lead</th><th class="r">Chốt</th><th class="r">Thất bại</th><th class="r">Tỷ lệ</th><th class="r">Giá trị chốt</th></tr></thead><tbody>${st.by_sale.map(r=>`<tr><td>${esc(r.k)}</td><td class="r">${r.n}</td><td class="r" style="color:var(--good)">${r.won}</td><td class="r" style="color:var(--bad)">${r.lost}</td><td class="r">${r.won+r.lost?Math.round(r.won/(r.won+r.lost)*100)+'%':'–'}</td><td class="r">${fmt(r.won_value)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">–</td></tr>'}</tbody></table></div>
   <div class="card"><h3>Theo nguồn (90 ngày)</h3><table><thead><tr><th>Nguồn</th><th class="r">Lead</th><th class="r">Chốt</th><th class="r">Tỷ lệ</th><th class="r">Giá trị</th></tr></thead><tbody>${st.by_source.map(r=>`<tr><td>${esc(r.k)}</td><td class="r">${r.n}</td><td class="r">${r.won}</td><td class="r">${r.won+r.lost?Math.round(r.won/(r.won+r.lost)*100)+'%':'–'}</td><td class="r">${fmt(r.won_value)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">–</td></tr>'}</tbody></table>
   ${st.lost_reasons.length?`<h3 style="margin-top:12px">Lý do thất bại</h3>${st.lost_reasons.map(r=>`<div class="small">${esc(r.k)} <b>${r.n}</b></div>`).join('')}`:''}</div></div>`;
  bindTopbar();
  const draw=()=>{const q=($('#fQ').value||'').toLowerCase();const f=rows.filter(r=>!q||(r.name||'').toLowerCase().includes(q)||(r.phone||'').includes(q));
    $('#kb').innerHTML=LSTAT.map(([k,l])=>{const list=f.filter(r=>r.status===k);return `<div class="col"><h4>${l}<span class="muted">${list.length}</span></h4>${list.slice(0,40).map(r=>`<div class="lead" onclick="openLead(${r.id})"><b>${esc(r.name)}</b><span class="m">${esc(r.phone||'')} ${r.source?'· '+esc(r.source):''}</span><span class="m">${esc(r.sale||'')}${r.value?' · '+fmtK(r.value):''}${r.next_date?' · ⏰ '+dmy(r.next_date):''}</span></div>`).join('')}${list.length>40?`<div class="small muted">+${list.length-40}</div>`:''}</div>`}).join('')};
  $('#fQ').oninput=draw;draw();
  $('#bNew').onclick=()=>leadForm({});
  $('#bImp').onclick=()=>{const mb=$('#modalBody');mb.innerHTML=`<div class="row"><h2 style="margin:0;flex:1">Dán từ Excel</h2><button class="btn" onclick="closeModal()">✕</button></div><p class="small muted">Copy các cột theo thứ tự: <b>Tên, SĐT, Nguồn, Sale, Ghi chú</b> (mỗi dòng 1 khách) rồi dán vào đây.</p><textarea id="impT" style="min-height:200px"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" id="impB">Nhập</button></div>`;$('#modal').classList.add('open');
    $('#impB').onclick=async()=>{const r=await api('/leads/import',{method:'POST',body:{text:$('#impT').value}});closeModal();toast('Đã nhập '+r.created+' khách');loadPage()}};
}
function leadForm(l){const mb=$('#modalBody');const f=(id,label,val,type='text',extra='')=>`<label>${label}<br><input class="f" id="${id}" type="${type}" value="${esc(val??'')}" style="width:100%" ${extra}></label>`;
  mb.innerHTML=`<div class="row"><h2 style="margin:0;flex:1">${l.id?'Sửa':'Thêm'} khách tiềm năng</h2><button class="btn" onclick="closeModal()">✕</button></div>
  <div class="grid g2" style="margin-top:12px">${f('lName','Tên *',l.name)}${f('lPhone','SĐT',l.phone)}${f('lSource','Nguồn (Facebook/Zalo/Giới thiệu/Live…)',l.source,'text','list="srcList"')}<datalist id="srcList"><option>Facebook</option><option>Zalo</option><option>TikTok/Live</option><option>Giới thiệu</option><option>Sàn TMĐT</option><option>Khách cũ</option><option>Hội chợ</option></datalist>
  <label>Sale<br><select class="f" id="lSale" style="width:100%"><option value="">(tôi)</option>${state.sales.filter(x=>x!=='(Chưa gán)').map(x=>`<option ${x===l.sale?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
  ${f('lValue','Giá trị dự kiến (đ)',l.value||'','number')}${f('lProd','Quan tâm sản phẩm',l.product_interest)}${f('lAddr','Địa chỉ',l.address)}
  <label>Trạng thái<br><select class="f" id="lStatus" style="width:100%">${LSTAT.map(([k,v])=>`<option value="${k}" ${k===(l.status||'new')?'selected':''}>${v}</option>`).join('')}</select></label>
  ${f('lNext','Việc tiếp theo',l.next_action)}${f('lNextD','Ngày hẹn',l.next_date,'date')}${f('lLost','Lý do thất bại (nếu có)',l.lost_reason)}</div>
  <label>Ghi chú<br><textarea class="f" id="lNote">${esc(l.note||'')}</textarea></label>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="lSave">Lưu</button>${l.id&&state.user.role!=='sale'?`<button class="btn" id="lDel">Xoá</button>`:''}</div>`;
  $('#modal').classList.add('open');
  $('#lSave').onclick=async()=>{const b={id:l.id,name:$('#lName').value,phone:$('#lPhone').value,source:$('#lSource').value,sale:$('#lSale').value,value:$('#lValue').value,product_interest:$('#lProd').value,address:$('#lAddr').value,status:$('#lStatus').value,next_action:$('#lNext').value,next_date:$('#lNextD').value,lost_reason:$('#lLost').value,note:$('#lNote').value};
    const r=await api('/leads',{method:'POST',body:b});if(b.next_date&&b.next_action){await api('/tasks',{method:'POST',body:{lead_id:r.id,title:b.next_action+': '+b.name,type:'call',due_date:b.next_date,assigned_to:b.sale,auto_key:'lead:'+r.id+':'+b.next_date}})}closeModal();toast('Đã lưu');loadPage()};
  const d=$('#lDel');if(d)d.onclick=async()=>{if(confirm('Xoá khách tiềm năng này?')){await api('/leads',{method:'POST',body:{id:l.id,delete:true}});closeModal();loadPage()}}}
async function openLead(id){const d=await api('/leads/'+id);const l=d.lead;const mb=$('#modalBody');
  mb.innerHTML=`<div class="row"><h2 style="margin:0;flex:1">🧲 ${esc(l.name)} <span class="tag info">${LSTAT.find(x=>x[0]===l.status)?.[1]||l.status}</span></h2><button class="btn" onclick="closeModal()">✕</button></div>
  <div class="grid g2" style="margin-top:12px"><div class="kv"><b>SĐT</b><span>${esc(l.phone||'')}</span><b>Nguồn</b><span>${esc(l.source||'')}</span><b>Sale</b><span>${esc(l.sale||'')}</span><b>Giá trị</b><span>${fmt(l.value)}</span><b>Quan tâm</b><span>${esc(l.product_interest||'')}</span><b>Địa chỉ</b><span>${esc(l.address||'')}</span><b>Việc tiếp</b><span>${esc(l.next_action||'')} ${l.next_date?'— '+dmy(l.next_date):''}</span><b>Ghi chú</b><span>${esc(l.note||'')}</span>${l.lost_reason?`<b>Lý do thất bại</b><span>${esc(l.lost_reason)}</span>`:''}<b>Tạo</b><span>${(l.created||'').replace('T',' ')} · ${esc(l.created_by||'')}</span></div>
  <div><div class="row" style="margin-bottom:10px"><b class="small">Chuyển trạng thái:</b>${LSTAT.map(([k,v])=>`<button class="btn small ${k===l.status?'primary':''}" onclick="setLeadStatus(${l.id},'${k}')">${v}</button>`).join('')}</div>
  <div class="row"><button class="btn" onclick="leadForm(${JSON.stringify(l).replace(/"/g,'&quot;')})">✎ Sửa</button><button class="btn" onclick="newTask(null,${l.id})">+ Việc</button>${d.kiot_match?`<button class="btn" onclick="convertLead(${l.id},${d.kiot_match.id})">✔ Đã có trên KiotViet: ${esc(d.kiot_match.name)} → đánh dấu chốt</button>`:'<span class="small muted">Chưa thấy SĐT này trên KiotViet</span>'}</div>
  ${d.tasks.length?`<h3 style="margin-top:12px">Việc</h3>${d.tasks.map(t=>`<div class="small">${t.status==='done'?'✅':t.status==='cancelled'?'✖':'☐'} ${dmy(t.due_date)} ${esc(t.title)} ${t.result?'— '+esc(t.result):''}</div>`).join('')}`:''}</div></div>
  <h3 style="margin-top:12px">Lịch sử trao đổi</h3>${d.notes.map(n=>`<div class="small" style="padding:6px 0;border-bottom:1px solid var(--border)"><b>${esc(n.author)}</b> <span class="muted">${n.created.replace('T',' ')}</span><br>${esc(n.content)}</div>`).join('')}
  <textarea id="lnote" placeholder="Ghi lại nội dung gọi/nhắn…" style="margin-top:8px"></textarea><div class="row" style="margin-top:6px"><button class="btn primary" id="lnSave">Lưu</button></div>`;
  $('#modal').classList.add('open');
  $('#lnSave').onclick=async()=>{const v=$('#lnote').value.trim();if(!v)return;await api(`/leads/${id}/notes`,{method:'POST',body:{content:v}});openLead(id)}}
async function setLeadStatus(id,s){let reason=null;if(s==='lost'){reason=prompt('Lý do thất bại (giá cao / không phản hồi / chọn bên khác…):','');if(reason===null)return}await api('/leads/status',{method:'POST',body:{id,status:s,lost_reason:reason}});toast('Đã cập nhật');openLead(id);if(state.page==='leads')loadPage()}
async function convertLead(id,cid){await api(`/leads/${id}/convert`,{method:'POST',body:{customer_id:cid}});toast('Đã chốt');openLead(id);loadPage()}

}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};

// Sort table by clicking header (simple, client side)
function sortable(sel,redraw){const t=$(sel);if(!t)return;t.querySelectorAll('th').forEach((th,i)=>{th.onclick=()=>{const tb=t.tBodies[0];const rows=[...tb.rows];const asc=th.dataset.asc!=='1';th.dataset.asc=asc?'1':'0';
  const val=r=>{const x=r.cells[i].textContent.replace(/[^\d.,\-−]/g,'').replace('−','-').replace(/\./g,'').replace(',','.');return x!==''&&!isNaN(+x)?+x:r.cells[i].textContent.toLowerCase()};
  rows.sort((a,b)=>{const A=val(a),B=val(b);return (A>B?1:A<B?-1:0)*(asc?1:-1)});rows.forEach(r=>tb.appendChild(r))}})}

// Theme + boot
api('/me').then(u=>{state.user=u;boot()}).catch(()=>render());
api('/status').then(s=>state.churn=s.churn_days).catch(()=>{});
</script>
